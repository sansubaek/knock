<style>

.hj-paper{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.hj-hills{position:absolute;left:-22px;right:-22px;bottom:0;height:150px}

.hj-row{display:flex;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid rgba(58,51,43,.16)}
.hj-row:last-child{border-bottom:0}

.hj-links{display:flex;gap:10px}

.hj-give{margin-top:10px;height:50px;border:1.5px solid #B23A28;color:#B23A28;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:16px;letter-spacing:.06em;font-weight:700}
