<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>knock! 테마 01 · 클린 타일</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
.v{width:390px;min-height:1339px;box-sizing:border-box;background:#F2F4F6;color:#191F28;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;padding-bottom:36px}
.v *{box-sizing:border-box}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.04em}
.top{background:#fff;padding:14px 20px 20px;border-radius:0 0 28px 28px}
.bar{display:flex;justify-content:space-between;align-items:center;height:32px}
.bar .brand{font-size:19px}
.cnt{font-size:12px;color:#6B7684;display:flex;align-items:center;gap:6px}
.cnt i{width:6px;height:6px;border-radius:50%;background:#2DBE6C;display:inline-block}
.me{display:flex;gap:14px;align-items:center;padding:18px 0 4px}
.av{width:68px;height:68px;border-radius:24px;background:#F2F4F6;border:1.5px dashed #D1D6DB;display:flex;align-items:center;justify-content:center;flex:none}
.me b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.me span{font-size:14px;color:#6B7684}
.mood{margin-top:14px;display:flex;gap:10px;align-items:center;background:#FCE8ED;border-radius:16px;padding:12px 14px}
.mood small{font-size:12px;color:#C2244C;font-weight:700;flex:none}
.mood p{margin:0;font-size:15px;font-weight:700;color:#191F28}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{font:inherit;border:none;font-size:15px;font-weight:700;height:52px;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.acts .knock{flex:1.4;background:#E0335E;color:#fff}
.acts .knock em{font-style:normal;font-weight:500;opacity:.85}
.acts .gb{flex:1;background:#F2F4F6;color:#191F28}
.after{margin:10px 12px 0;background:#191F28;color:#fff;border-radius:20px;padding:16px 18px;display:flex;gap:12px;align-items:center;position:relative}
.after .tag{position:absolute;top:-9px;left:16px;background:#fff;color:#6B7684;border:1px solid #E5E8EB;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px}
.after b{display:block;font-size:15px}
.after span{font-size:13px;color:#B0B8C1}
.after a{margin-left:auto;flex:none;background:#fff;color:#191F28;font-weight:700;font-size:13px;padding:9px 12px;border-radius:12px;text-decoration:none}
.sec{background:#fff;border-radius:24px;margin:10px 12px 0;padding:20px}
.sec h2{margin:0 0 14px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec h2 small{font-size:12px;font-weight:500;color:#8B95A1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.t{border-radius:20px;background:#F2F4F6;padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.t small{font-size:12px;color:#6B7684}
.t p{margin:0;font-size:15px;font-weight:700;line-height:1.4}
.ph{grid-column:span 2;height:210px;align-items:center;justify-content:center;gap:6px;border:1.5px dashed #D1D6DB;background:#F9FAFB}
.ph p{font-weight:500;font-size:13px;color:#8B95A1}
.dday p{font-size:30px;font-weight:800;letter-spacing:-.02em}
.song{flex-direction:row;align-items:center;gap:12px;justify-content:flex-start}
.song i{width:44px;height:44px;border-radius:14px;background:#191F28;display:flex;align-items:center;justify-content:center;flex:none}
.song div{display:flex;flex-direction:column}
.q{background:#FFF7E0}
.q p{font-size:14px}
.stk{position:absolute;pointer-events:none}
.rows a{display:flex;align-items:center;gap:14px;padding:12px 0;text-decoration:none;color:#191F28}
.rows a+a{border-top:1px solid #F2F4F6}
.rows .ic{width:40px;height:40px;border-radius:12px;background:#F2F4F6;display:flex;align-items:center;justify-content:center;flex:none}
.rows span{flex:1}
.rows small{display:block;color:#6B7684;font-size:12px}
.gbook .e{padding:12px 0;border-top:1px solid #F2F4F6}
.gbook .e:first-of-type{border-top:0;padding-top:0}
.gbook .e b{font-size:14px}
.gbook .e b span{font-weight:400;color:#8B95A1;font-size:12px;margin-left:6px}
.gbook .e p{margin:2px 0 0;font-size:14px}
.gbook .in{display:flex;gap:8px;margin-top:12px}
.gbook .in span{flex:1;height:46px;border-radius:12px;background:#F2F4F6;display:flex;align-items:center;padding:0 14px;color:#8B95A1;font-size:14px}
.gbook .in em{height:46px;padding:0 16px;border-radius:12px;background:#191F28;color:#fff;font-style:normal;font-weight:700;font-size:14px;display:flex;align-items:center}
.own{text-align:center;font-size:12px;color:#B0B8C1;margin-top:28px}
.own a{color:#4E5968;font-weight:700}
.note{margin:14px 16px 0;font-size:12px;color:#8B95A1;line-height:1.6}
</style>
</helmet>
<div class="v">
  <div class="top">
    <div class="bar"><span class="brand">knock!</span><span class="cnt"><i></i>오늘 4명 · 지금까지 112명</span></div>
    <div class="me">
      <div class="av" role="img" aria-label="프로필 사진 자리"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B0B8C1" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></div>
      <div><b>지우</b><span>똑똑, 들어와도 돼</span></div>
    </div>
    <div class="mood"><small>오늘의 기분</small><p>시험 D-3, 커피 수혈 중</p></div>
    <div class="acts"><button type="button" class="knock"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V7a2 2 0 014 0v4M11 10V6a2 2 0 014 0v5M15 10a2 2 0 014 0v3a7 7 0 01-7 7h-1a6 6 0 01-5.2-3L4 14a2 2 0 013.4-2L9 13"/></svg>노크하기 <em>27</em></button><button type="button" class="gb">방명록 쓰기</button></div>
  </div>

  <div class="sec">
    <h2>지우의 방 <small>어제 꾸밈</small></h2>
    <div class="grid">
      <div class="t ph"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><p>주인이 올린 사진</p></div>
      <div class="t dday"><small>생일까지</small><p>D-12</p></div>
      <div class="t q"><small>요즘 질문</small><p>제일 좋아하는 편의점 간식은?</p></div>
      <div class="t song" style="grid-column:span 2;min-height:0"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></i><div><small>요즘 듣는 노래</small><p>좋은 날 · 아이유</p></div></div>
      <svg class="stk" style="right:-6px;top:186px" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.3 6.8.6-5.2 4.5 1.6 6.6L12 16.6 6.2 20l1.6-6.6L2.6 8.9l6.8-.6z" fill="#FFD25E" stroke="#191F28" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <svg class="stk" style="left:-4px;top:316px" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0112 6.6 5.3 5.3 0 0121.3 12C19 16.6 12 21 12 21z" fill="#FF8FA8" stroke="#191F28" stroke-width="1.2"/></svg>
    </div>
  </div>

  <div class="sec rows">
    <a href="#"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></span><span>인스타그램<small>@jiwoo.room</small></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B0B8C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <a href="#"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg></span><span>필름 사진 모아둔 곳<small>블로그</small></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B0B8C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
  </div>

  <div class="sec gbook">
    <h2>방명록 2 <small>주인이 확인한 글만 보여요</small></h2>
    <div class="e"><b>민지<span>10.4</span></b><p>케이스 뭐야 너무 귀엽잖아</p></div>
    <div class="e"><b>익명<span>10.2</span></b><p>도서관에서 찍고 감</p></div>
    <div class="in"><span>한 줄 남기기</span><em>남기기</em></div>
  </div>

  <p class="own">knock! · <a href="#">나도 knock 만들기</a></p>
</div>
</x-dc>

</body>
</html>
