<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>knock! 아이소 미니룸 · 꾸미기 체험판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--bg1:#FFF6DD;--bg2:#FFF8EA;--dot:rgba(160,120,60,.13);--card:#FFFDF7;--line:#EEDFC4;--line2:#E9D9BD;--ink:#3F3128;--ink2:#6E5A4A;--mute:#9A836E;--acc:#FFE07A;--acc2:#FFD54F;--chip:#FFF5D6;--chipl:#F0DFAE;--room1:#FFEFC0;--room2:#FBE6CC;--roomb:#EED9AE;--memo:#FFE88F;--dark:#3F3128;--darkt:#FFF6DD}
html,body{margin:0;background:var(--bg2)}
body{-webkit-tap-highlight-color:transparent}
.mr{max-width:390px;margin:0 auto;min-height:100vh;box-sizing:border-box;padding:0 16px 120px;font-family:'Noto Sans KR',sans-serif;color:var(--ink);word-break:keep-all;line-height:1.45;font-size:14px;
background:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.4px) 0 0/16px 16px,linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 60%);transition:background .4s,color .4s}
.mr *{box-sizing:border-box}
.mr-bar{height:56px;display:flex;align-items:center;justify-content:space-between}
.mr-logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.04em;color:var(--ink);font-style:italic}
.mr-cnt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);background:var(--card);border:1.2px solid var(--line2);border-radius:99px;padding:5px 11px}
.mr-cnt b{color:var(--ink);font-weight:700}
.mr-cnt i{width:6px;height:6px;border-radius:50%;background:#8CCB8A;display:inline-block}
.mr-hd{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 10px;gap:8px}
.mr-hd h1{margin:0;font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:26px;letter-spacing:-.01em;color:var(--ink);line-height:1.15}
.mr-hd h1 small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--mute);font-weight:500;letter-spacing:0;margin-bottom:3px}
.mr-hd>span{font-size:12px;color:var(--mute);flex:none}
.mr-room{position:relative;border-radius:30px;background:linear-gradient(180deg,var(--room1) 0%,var(--room2) 100%);border:1.5px solid var(--roomb);box-shadow:0 14px 30px -18px rgba(140,100,40,.45),inset 0 1px 0 rgba(255,255,255,.7);overflow:hidden;transition:background .4s}
.mr-svg{display:block;width:100%;height:auto}
.mr-np{display:flex;align-items:center;gap:10px;margin:-4px 12px 12px;background:var(--card);border:1.4px solid #5A4636;border-radius:20px;padding:9px 10px 9px 9px;position:relative}
.mr-pl{width:38px;height:38px;border-radius:50%;background:var(--acc);border:1.3px solid #5A4636;display:flex;align-items:center;justify-content:center;color:#3F3128;flex:none;padding-left:2px}
.mr-npt{min-width:0;flex:1}
.mr-npt small{display:block;font-size:12px;color:var(--mute);line-height:1.2}
.mr-npt b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.mr-npt b span{font-weight:500;color:var(--ink2);font-size:13px}
.mr-eq{display:flex;align-items:flex-end;gap:2px;height:16px}
.mr-eq i{width:3px;border-radius:2px;background:#E8B93A;display:block;animation:eq 1s ease-in-out infinite alternate}
.mr-eq i:nth-child(1){height:7px}.mr-eq i:nth-child(2){height:14px;animation-delay:.2s}.mr-eq i:nth-child(3){height:10px;animation-delay:.4s}.mr-eq i:nth-child(4){height:16px;animation-delay:.1s}
@keyframes eq{to{transform:scaleY(.45);transform-origin:bottom}}
.mr-dd{flex:none;text-align:center;background:var(--dark);color:var(--acc);border-radius:14px;padding:4px 10px 5px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;line-height:1.1}
.mr-dd small{display:block;font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:10.5px;color:#F3E6C8}
.mr-prof{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:18px}
.mr-prow{display:flex;gap:14px;align-items:center}
.mr-pic{width:68px;height:68px;border-radius:22px;border:1.6px dashed #CDB79B;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);font-size:11px;gap:2px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.mr-pic.has{border-style:solid;border-color:var(--line)}
.mr-pic.has>*{display:none}
.mr-name{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mr-mbti{font-family:'Bricolage Grotesque',sans-serif;font-size:12px;font-weight:800;background:var(--acc);color:#3F3128;border:1.2px solid #3F3128;border-radius:99px;padding:1px 9px;letter-spacing:.02em}
.mr-intro{font-size:14px;color:var(--ink2);margin-top:1px}
.mr-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.mr-chips span{font-size:12px;font-weight:500;color:var(--ink2);background:var(--chip);border:1px solid var(--chipl);border-radius:99px;padding:5px 10px}
.mr-knock{margin-top:14px;width:100%;height:60px;border-radius:20px;border:1.6px solid #3F3128;background:linear-gradient(180deg,var(--acc),var(--acc2));box-shadow:0 4px 0 #3F3128;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:18px;font-weight:800;color:#3F3128;cursor:pointer;transition:transform .08s,box-shadow .08s}
.mr-knock:active{transform:translateY(3px);box-shadow:0 1px 0 #3F3128}
.mr-knock em{font-style:normal;font-family:'Bricolage Grotesque',sans-serif;font-size:14px;background:#3F3128;color:var(--acc);border-radius:99px;padding:2px 10px 3px}
.mr-knote{text-align:center;font-size:12px;color:var(--mute);margin-top:10px}
.mr-sec{margin-top:22px}
.mr-st{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px}
.mr-st h2{margin:0;font-size:16px;font-weight:800}
.mr-st span{font-size:12px;color:var(--mute)}
.mr-memo{position:relative;background:var(--memo);border-radius:6px 6px 22px 6px;padding:18px 18px 16px;box-shadow:0 10px 18px -12px rgba(120,90,20,.5);transform:rotate(-.6deg);color:#3F3128}
.mr-memo:before{content:'';position:absolute;top:-8px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(255,255,255,.65);border:1px solid rgba(200,170,110,.4);transform:rotate(2deg)}
.mr-memo small{font-size:12px;font-weight:700;color:#8C6A1E}
.mr-memo p{margin:4px 0 12px;font-size:18px;font-weight:800;letter-spacing:-.02em;color:#3F3128}
.mr-ans{display:flex;gap:8px}
.mr-memo input{flex:1;min-width:0;height:44px;border-radius:14px;border:1.2px solid rgba(63,49,40,.25);background:rgba(255,255,255,.7);padding:0 14px;font:inherit;font-size:14px;color:#3F3128}
.mr-memo button{height:44px;padding:0 16px;border-radius:14px;border:none;background:#3F3128;color:#FFE88F;font:inherit;font-size:14px;font-weight:700}
.mr-photos{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.mr-ph{border-radius:20px;border:1.6px dashed #CDB79B;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mute);font-size:12px;height:170px;background-size:cover;background-position:center;overflow:hidden}
.mr-ph.has{border-style:solid;border-color:var(--line)}
.mr-ph.has>*{display:none}
.mr-ph2{display:grid;grid-template-rows:1fr 1fr;gap:10px}
.mr-ph2 .mr-ph{height:auto}
.mr-lock{display:flex;align-items:center;gap:12px;background:var(--dark);color:var(--darkt);border-radius:20px;padding:14px 16px}
.mr-li{width:40px;height:40px;border-radius:14px;background:rgba(255,224,122,.18);display:flex;align-items:center;justify-content:center;color:#FFE07A;flex:none}
.mr-lock b{display:block;font-size:14px}
.mr-lock small{font-size:12px;color:#D9C9AE}
.mr-lock>span{margin-left:auto;font-size:12px;font-weight:700;color:#3F3128;background:#FFE07A;border-radius:99px;padding:6px 11px;flex:none}
.mr-gb{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:6px 16px 16px}
.mr-g{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line2)}
.mr-gi{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:1.2px solid #3F3128;color:#3F3128}
.mr-gm{font-size:12px;color:var(--mute)}
.mr-gm b{color:var(--ink);font-size:13px;margin-right:6px}
.mr-g p{margin:2px 0 0;font-size:14px}
.mr-form{display:flex;gap:8px;margin-top:14px}
.mr-form input{flex:1;min-width:0;height:46px;border-radius:15px;border:1.2px solid var(--line);background:var(--chip);padding:0 14px;font:inherit;font-size:14px;color:var(--ink)}
.mr-form button{height:46px;padding:0 18px;border-radius:15px;border:1.4px solid #3F3128;background:var(--acc);font:inherit;font-size:14px;font-weight:800;color:#3F3128}
.mr-links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mr-lk{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;text-decoration:none;color:var(--ink)}
.mr-lt{display:flex;justify-content:space-between;align-items:center;color:var(--mute)}
.mr-lt i{width:34px;height:34px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.mr-lk b{font-size:14px;line-height:1.3}
.mr-lk small{display:block;font-size:12px;color:var(--mute);font-weight:400;margin-top:2px}
.mr-foot{text-align:center;font-size:12px;color:var(--mute);margin-top:26px;opacity:.8}

/* 편집 모드 표시 */
.edit [data-t]{outline:1px dashed rgba(90,70,54,.28);outline-offset:2px;border-radius:6px;cursor:text}
.edit .mr-chips span[data-t]{outline-offset:1px}
.edit [data-sec]{cursor:pointer}
.edit [data-photo]{cursor:pointer}
.edit svg [data-t]{outline:none}
.edit svg .tagbox{stroke-dasharray:3 2}
.sel-flash{animation:flash .6s ease-out}
@keyframes flash{0%{filter:brightness(1.25)}100%{filter:none}}
.hint{position:sticky;top:0;z-index:20;margin:0 -16px;padding:9px 16px;background:rgba(30,26,24,.88);color:#fff;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;backdrop-filter:blur(8px)}
.hint button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:99px;padding:5px 10px;font:inherit;font-size:12px;flex:none}
.view .hint{display:none}

/* 아래 바 */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:40;display:flex;gap:4px;background:rgba(28,24,22,.94);border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:'Noto Sans KR',sans-serif}
.dock button{background:none;border:0;color:#F3EADF;font:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;width:70px;padding:7px 0 6px;border-radius:16px;cursor:pointer}
.dock button svg{width:20px;height:20px}
.dock button.on{background:rgba(255,255,255,.14);color:#fff}
.view .dock .ed-only{display:none}
.dock .back{display:none}
.view .dock .back{display:flex;width:120px}

/* 시트 */
.scrim{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.04);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:50;width:100%;max-width:430px;transform:translate(-50%,105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);background:#fff;color:#1E1A18;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);font-family:'Noto Sans KR',sans-serif;font-size:13px;max-height:66vh;display:flex;flex-direction:column}
.sheet.on{transform:translate(-50%,0)}
.sh-top{padding:10px 16px 0;flex:none}
.sh-grab{width:38px;height:4px;border-radius:4px;background:#DDD6CF;margin:0 auto 10px}
.sh-tt{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:800;margin-bottom:10px}
.sh-tt button{border:0;background:#1E1A18;color:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.sh-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.sh-tabs::-webkit-scrollbar{display:none}
.sh-tabs button{flex:none;border:1px solid #E6DFD8;background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;color:#5C534C;cursor:pointer}
.sh-tabs button.on{background:#1E1A18;border-color:#1E1A18;color:#fff}
.sh-body{overflow-y:auto;padding:4px 16px 24px;flex:1;-webkit-overflow-scrolling:touch}
.lb{font-size:11.5px;color:#8C827A;font-weight:700;margin:12px 0 7px}
.lb:first-child{margin-top:2px}
.sw-row{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #DDD5CC;cursor:pointer;padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px #1E1A18}
.sw.none{background:#fff}
.sw.none:after{content:'';position:absolute;left:5px;right:5px;top:50%;height:1.5px;background:#C9BFB5;transform:rotate(-45deg)}
.tile-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.tile{border:0;background:none;padding:0;font:inherit;font-size:11.5px;color:#4A423C;cursor:pointer;text-align:center}
.tile .pv{display:block;width:100%;aspect-ratio:1;border-radius:14px;box-shadow:0 0 0 1px #E3DBD3;margin-bottom:4px;overflow:hidden;background:#FBF7F2;position:relative}
.tile.on .pv{box-shadow:0 0 0 2.5px #1E1A18}
.tile .pv svg{width:100%;height:100%;display:block}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0EBE5}
.frow .pv{width:56px;height:56px;border-radius:12px;background:#FBF7F2;box-shadow:0 0 0 1px #EAE3DC;flex:none;overflow:hidden}
.frow .pv svg{width:100%;height:100%;display:block}
.frow .fm{flex:1;min-width:0}
.frow .fm b{font-size:13.5px;display:block;margin-bottom:5px}
.frow .fm .sw-row{gap:6px}
.frow .fm .sw{width:24px;height:24px}
.frow.off .pv,.frow.off .fm .sw-row{opacity:.35}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #E3DBD3;background:#fff;border-radius:99px;padding:5px 10px;font:inherit;font-size:12px;color:#3B342F;cursor:pointer}
.chip.on{background:#1E1A18;color:#fff;border-color:#1E1A18}
.tg{width:44px;height:26px;border-radius:99px;background:#DCD4CC;border:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
.tg:after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:#1E1A18}
.tg.on:after{left:21px}
.btn{border:0;background:#1E1A18;color:#fff;border-radius:14px;padding:11px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn.l{background:#F2EDE8;color:#1E1A18}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.txt{width:100%;border:1.5px solid #E3DBD3;border-radius:14px;padding:12px;font:inherit;font-size:15px;color:#1E1A18;background:#FBF8F5;resize:none}
.txt:focus{outline:none;border-color:#1E1A18;background:#fff}
.cnt-n{font-size:11.5px;color:#8C827A;text-align:right;margin-top:4px}
.pal{border:0;background:#fff;padding:0;cursor:pointer;text-align:left;font:inherit;font-size:12px;color:#3B342F}
.pal .pv{display:block;height:86px;border-radius:16px;box-shadow:0 0 0 1px #E3DBD3;padding:10px;margin-bottom:5px;position:relative;overflow:hidden}
.pal.on .pv{box-shadow:0 0 0 2.5px #1E1A18}
.pal .pv i{display:block;border-radius:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#1E1A18;color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:12.5px;padding:9px 14px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.pop{position:fixed;z-index:61;pointer-events:none;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;color:#3F3128;animation:pop 1s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(-50%,0) scale(.6)}to{opacity:0;transform:translate(-50%,-70px) scale(1.15)}}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="mr edit" id="app">
<div class="hint" id="hint"><span>바꾸고 싶은 곳을 바로 눌러보세요</span><button id="resetBtn">처음으로</button></div>
<div class="mr-bar"><div class="mr-logo">knock!</div><div class="mr-cnt"><i></i>오늘 <b>4</b>명 · 지금까지 <b id="totN">112</b>명</div></div>
<div class="mr-hd"><h1><small data-t="title_s"></small><span data-t="title"></span></h1><span data-t="hd_r"></span></div>
<div class="mr-room" id="room">
<svg class="mr-svg" id="roomSvg" viewBox="0 0 358 367" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="mr-np"><i class="mr-pl"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.7L9.5 4.6A1 1 0 0 0 8 5.5Z"/></svg></i><div class="mr-npt"><small data-t="np_s"></small><b><span data-t="np_t" style="font-weight:800;color:var(--ink);font-size:15px"></span> <span>· <span data-t="np_a"></span></span></b></div><div class="mr-eq"><i></i><i></i><i></i><i></i></div><div class="mr-dd"><small data-t="dd_s"></small><span data-t="dd_v"></span></div></div>
</div>

<div class="mr-prof">
<div class="mr-prow"><div class="mr-pic" data-photo="prof" id="profPic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3.6"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg><span>프로필</span></div>
<div><div class="mr-name"><span data-t="name"></span><span class="mr-mbti" data-t="mbti"></span></div><div class="mr-intro" data-t="intro"></div></div></div>
<div class="mr-chips"><span data-t="chip0"></span><span data-t="chip1"></span><span data-t="chip2"></span><span data-t="chip3"></span></div>
<button class="mr-knock" id="knockBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V6.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V5a1.5 1.5 0 0 1 3 0v5.5"/><path d="M14 10.5V6.5a1.5 1.5 0 0 1 3 0V13c0 4-2.6 7-6.5 7-2.6 0-4.4-1.3-5.6-3.4L3.6 14a1.6 1.6 0 0 1 2.6-1.8L8 14"/></svg><span data-t="knock"></span><em id="knockN">27</em></button>
<div class="mr-knote">지금까지 <b id="knockN2">27</b>번 똑똑 두드렸어요</div>
</div>

<div class="mr-sec">
<div class="mr-st"><h2 data-t="memo_h"></h2><span data-t="memo_s"></span></div>
<div class="mr-memo"><small data-t="memo_qs"></small><p data-t="memo_q"></p>
<div class="mr-ans"><input placeholder="내 답 붙이기" id="ansIn"><button id="ansBtn">붙이기</button></div></div>
</div>

<script>
// ===== 미니룸 그리기 엔진 =====
const OL='#5A4636', CO='#4A3A30';
const NS='vector-effect="non-scaling-stroke"';
const CS=`stroke="${CO}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"`;
function hx(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function sh(h,a){const c=hx(h).map(v=>a<0?v*(1+a):v+(255-v)*a);return '#'+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
let BB=null;
function P(x,y,z){const p=[179+16.021*(x-y),154+9.25*(x+y)-18.5*z];if(BB){BB[0]=Math.min(BB[0],p[0]);BB[1]=Math.min(BB[1],p[1]);BB[2]=Math.max(BB[2],p[0]);BB[3]=Math.max(BB[3],p[1])}return p}
const r1=n=>Math.round(n*10)/10;
function reg(x,y){if(BB){BB[0]=Math.min(BB[0],x);BB[1]=Math.min(BB[1],y);BB[2]=Math.max(BB[2],x);BB[3]=Math.max(BB[3],y)}}
function poly(pts,fill,ex=''){return `<polygon points="${pts.map(p=>r1(p[0])+','+r1(p[1])).join(' ')}" fill="${fill}" stroke="${OL}" stroke-width="1.3" stroke-linejoin="round" ${ex}/>`}
function box(x,y,z,w,d,h,c,o={}){const T=o.top||sh(c,.14),L=o.l||c,R=o.r||sh(c,-.1);
 return poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],R)+poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],L)+poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],T)}
const LW='matrix(16.021 -9.250 0 18.500 18.79 117.00)', RW='matrix(16.021 9.250 0 18.500 179.00 24.50)', FL='matrix(16.021 9.250 -16.021 9.250 179.00 154.00)';
function M(m,inner,ex=''){return `<g transform="${m}" ${ex}>${inner}</g>`}
function faceY(y){const o=P(0,y,0);return `matrix(16.021 9.25 0 -18.5 ${r1(o[0])} ${r1(o[1])})`}
function topZ(z){const o=P(0,0,z);return `matrix(16.021 9.25 -16.021 9.25 ${r1(o[0])} ${r1(o[1])})`}
// 벽·바닥이 원근 행렬 안에 있어도 테두리 굵기를 맞추려고 BB 계산용으로 벽 모서리를 등록
function regLocal(kind,u0,v0,u1,v1){if(!BB)return;const f=kind==='L'?(u,v)=>P(0,10-u,7-v):(u,v)=>P(u,0,7-v);f(u0,v0);f(u1,v1);f(u0,v1);f(u1,v0)}

// ---- 벽지 무늬 (벽 로컬 좌표, 1칸 = 방 1칸) ----
function patDef(id,k,c){
 if(k==='stripe')return `<pattern id="${id}" width="1" height="7" patternUnits="userSpaceOnUse"><rect width=".42" height="7" fill="${c}"/></pattern>`;
 if(k==='check')return `<pattern id="${id}" width="1" height="1" patternUnits="userSpaceOnUse"><rect width=".5" height=".5" fill="${c}" opacity=".7"/><rect x=".5" y=".5" width=".5" height=".5" fill="${c}" opacity=".7"/></pattern>`;
 if(k==='dot')return `<pattern id="${id}" width=".9" height=".8" patternUnits="userSpaceOnUse"><circle cx=".45" cy=".4" r=".1" fill="${c}"/></pattern>`;
 if(k==='flower')return `<pattern id="${id}" width="1.5" height="1.3" patternUnits="userSpaceOnUse"><g fill="${c}"><circle cx=".75" cy=".5" r=".11"/><circle cx=".75" cy=".8" r=".11"/><circle cx=".62" cy=".65" r=".11"/><circle cx=".88" cy=".65" r=".11"/></g><circle cx=".75" cy=".65" r=".07" fill="#FFFDF7"/><circle cx="0" cy="0" r=".05" fill="${c}"/><circle cx="1.5" cy="1.3" r=".05" fill="${c}"/></pattern>`;
 if(k==='star')return `<pattern id="${id}" width="1.6" height="1.4" patternUnits="userSpaceOnUse"><path d="M.8,.42 Q.83,.67 1.06,.7 Q.83,.73 .8,.98 Q.77,.73 .54,.7 Q.77,.67 .8,.42Z" fill="${c}"/><circle cx="0" cy="0" r=".06" fill="${c}"/><circle cx="1.6" cy="1.4" r=".06" fill="${c}"/></pattern>`;
 return '';
}
function patInk(wc){const l=hx(wc).reduce((a,b)=>a+b)/3;return l<140?sh(wc,.22):sh(wc,-.1)}

// ---- 바닥 무늬 (바닥 로컬 10x10) ----
function floorInner(k){
 const fc=FLOORS.find(f=>f[0]===k)[2], ln=sh(fc,-.1);let s=`<rect x="0" y="0" width="10" height="10" fill="${fc}" stroke="${OL}" stroke-width="1.3" ${NS}/>`;
 if(k==='wood'){const J=[[2.89,1.83],[4.17,2.24],[1.53,4.21],[8.34,7.4],[7.12,2.78],[5.29,3.21],[2.38,1.85],[2.72,8.42]];
  for(let i=1;i<8;i++)s+=`<line x1="0" y1="${i*1.25}" x2="10" y2="${i*1.25}" stroke="${ln}" stroke-width="1" ${NS}/>`;
  J.forEach((j,i)=>j.forEach(x=>s+=`<line x1="${x}" y1="${i*1.25}" x2="${x}" y2="${i*1.25+1.25}" stroke="${ln}" stroke-width="1" ${NS}/>`))}
 else if(k==='tile'){for(let i=1;i<8;i++){s+=`<line x1="0" y1="${i*1.25}" x2="10" y2="${i*1.25}" stroke="${ln}" stroke-width="1.2" ${NS}/><line x1="${i*1.25}" y1="0" x2="${i*1.25}" y2="10" stroke="${ln}" stroke-width="1.2" ${NS}/>`}
  for(let i=0;i<8;i++)for(let j=0;j<8;j++)if((i+j)%2===0)s+=`<rect x="${i*1.25+.08}" y="${j*1.25+.08}" width="1.09" height="1.09" fill="#fff" opacity=".35"/>`}
 else if(k==='carpet'){s+=`<rect x="0" y="0" width="10" height="10" fill="url(#fl-carpet)"/>`}
 else if(k==='marble'){['M0,2 C2,2.6 3,1.4 5,2.2 S8,3.6 10,2.6','M0,6.5 C1.5,6 3.5,7.4 5.5,6.6 S8.5,5.6 10,6.8','M2.5,0 C2.8,2 4,3.5 3.6,5.4','M7,4 C7.6,6 6.8,8 7.6,10'].forEach(d=>s+=`<path d="${d}" fill="none" stroke="#CFC9C0" stroke-width="1" ${NS}/>`);
  s+=`<path d="M0,5 L10,5 M5,0 L5,10" stroke="#E2DDD5" stroke-width="1" ${NS}/>`}
 return s;
}

// ---- 창문 (왼쪽 벽 로컬) ----
function windowInner(w,cur){
 let sky=w==='clear'?['#9FD3F7','#E2F3FF']:w==='night'?['#262E58','#4C5689']:['#A9B9D6','#D9E1EE'];
 let s=`<defs><linearGradient id="g-sky-${w}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient><clipPath id="c-win-${w}"><rect x="2.1" y="1.75" width="2.6" height="2.1"/></clipPath></defs>`;
 s+=`<rect x="1.8" y="1.45" width="3.2" height="2.7" fill="#FFFDF7" stroke="${OL}" stroke-width="1.3" ${NS}/><rect x="2.1" y="1.75" width="2.6" height="2.1" fill="url(#g-sky-${w})" stroke="${OL}" stroke-width="1" ${NS}/>`;
 s+=`<g clip-path="url(#c-win-${w})">`;
 if(w==='clear'){s+=`<circle cx="4.15" cy="2.25" r=".32" fill="#FFE07A" stroke="${OL}" stroke-width="1" ${NS}/><path d="M2.35,3.15 q.18-.38 .55-.3 q.14-.34 .52-.26 q.34-.06 .4.3 q.3.04 .26.3 Z" fill="#fff"/><path d="M3.6,3.6 q.12-.25 .37-.2 q.1-.22 .35-.17 q.23-.04 .27.2 q.2.03 .17.2 Z" fill="#fff" opacity=".9"/>`}
 else if(w==='rain'){s+=`<path d="M2.3,2.55 q.18-.38 .55-.3 q.14-.34 .52-.26 q.34-.06 .4.3 q.3.04 .26.3 Z" fill="#fff" opacity=".9"/>`;[[2.35,2.9],[2.75,3.35],[3.1,2.7],[3.5,3.2],[3.9,2.55],[4.3,3.05],[2.55,3.6],[3.3,3.65],[4.05,3.5],[4.45,2.4],[3.7,2.15]].forEach(([x,y])=>s+=`<line x1="${x}" y1="${y}" x2="${x-.1}" y2="${y+.32}" stroke="#fff" stroke-width="1.4" stroke-linecap="round" ${NS}/>`)}
 else{s+=`<circle cx="4.1" cy="2.25" r=".3" fill="#FFF3C4"/><circle cx="4.22" cy="2.18" r=".26" fill="#3B4473"/>`;[[2.4,2.1],[2.9,2.5],[3.3,2.0],[2.6,3.2],[3.6,3.0],[4.3,3.4],[3.1,3.6]].forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r=".05" fill="#FFF3C4"/>`)}
 s+=`</g><line x1="3.4" y1="1.75" x2="3.4" y2="3.85" stroke="${OL}" stroke-width="1" ${NS}/><line x1="2.1" y1="2.8" x2="4.7" y2="2.8" stroke="${OL}" stroke-width="1" ${NS}/>`;
 s+=`<rect x="1.65" y="4.1" width="3.5" height=".22" fill="#FFFDF7" stroke="${OL}" stroke-width="1" ${NS}/>`;
 s+=`<line x1="1.2" y1="1.2" x2="5.6" y2="1.2" stroke="${OL}" stroke-width="2" stroke-linecap="round" ${NS}/>`;
 s+=`<path d="M1.3,1.2 h.9 q-.05 1.4 .25 2.9 q-.6.15 -1.15 0 q-.12-1.5 0-2.9Z" fill="${cur}" stroke="${OL}" stroke-width="1.2" ${NS}/><path d="M5.5,1.2 h-.9 q.05 1.4 -.25 2.9 q.6.15 1.15 0 q.12-1.5 0-2.9Z" fill="${cur}" stroke="${OL}" stroke-width="1.2" ${NS}/>`;
 return s;
}

// ---- 가구 ----
const FUR={
 bed(o){const fr=WOODS[o.fr||0],bl=BLANKETS[o.c||0];
  return `<g data-sec="bed">`+box(.05,5.4,0,.3,4.25,2.45,fr)+box(.35,5.05,0,4.6,4.6,.85,fr,{top:sh(fr,.12),r:sh(fr,-.08)})+box(.45,5.1,.85,4.45,4.45,.55,'#F4EEE3',{top:'#FFFDF7',r:'#E4DCCD'})
  +box(.65,5.75,1.4,1.05,3.2,.32,'#F6F1E8',{top:'#FFFFFF',r:'#E6DFD2'})+box(2.15,5.0,.88,2.85,4.75,.68,bl,{top:sh(bl,.2),r:sh(bl,-.08)})
  +M(topZ(1.56),`<line x1="2.6" y1="5.3" x2="2.6" y2="9.5" stroke="${sh(bl,.5)}" stroke-width="2.2" ${NS}/><circle cx="3.4" cy="6.4" r=".1" fill="#fff"/><circle cx="4.2" cy="7.3" r=".1" fill="#fff"/><circle cx="3.3" cy="8.4" r=".1" fill="#fff"/>`)+`</g>`},
 desk(o){const c=DESKS[o.c||0];let s=`<g data-sec="desk">`;
  [[4.95,.2],[8.45,.2],[4.95,1.85],[8.45,1.85]].forEach(([x,y])=>s+=box(x,y,0,.17,.17,2.15,sh(c,-.05)));
  s+=box(4.9,.15,2.15,3.8,1.9,.18,c);
  if(o.top==='laptop'){s+=box(6.0,.55,2.33,1.7,1.15,.07,'#D9DCE2')+poly([P(6.0,.55,2.4),P(7.7,.55,2.4),P(7.7,.55,3.45),P(6.0,.55,3.45)],'#4A4F5C')+M(faceY(.55),`<rect x="6.12" y="2.52" width="1.46" height=".82" fill="url(#mr-scr)"/>`)}
  else{s+=box(6.75,.45,2.33,.5,.35,.08,'#4A4F5C')+box(6.92,.52,2.41,.16,.16,.45,'#4A4F5C')+box(5.85,.4,2.86,2.3,.16,1.35,'#4A4F5C')+M(faceY(.56),`<rect x="5.97" y="2.98" width="2.06" height="1.11" fill="url(#mr-scr)"/><rect x="6.15" y="3.6" width=".9" height=".1" fill="#E8B93A" opacity=".7"/><rect x="6.15" y="3.4" width="1.3" height=".1" fill="#E8B93A" opacity=".5"/>`)}
  s+=box(8.0,1.1,2.33,.42,.42,.42,'#FFFDF7')+M(topZ(2.75),`<circle cx="8.21" cy="1.31" r=".14" fill="#B88458"/>`);
  return s+`</g>`},
 shelf(o){const c=WOODS[o.c||0];let s=`<g data-sec="shelf">`+box(1.0,.02,4.2,3.0,.75,.14,c);

   h+=row('cal','벽 달력',thumbIso(()=>{P(0,3,4);P(0,1.2,5.2);return M(LW,`<rect x="7.0" y="2.0" width="1.75" height="1.95" rx=".12" fill="#FFFDF7" stroke="${OL}" stroke-width="1.2" ${NS}/><path d="M7.0,2.55 V2.12 h1.75 V2.55 Z" fill="#E98B6F"/>`)}),`<div class="cnt-n" style="text-align:left">숫자는 D-day를 따라가요</div>`);
   h+=row('memo','벽 메모',thumbIso(()=>{P(8.8,0,5);P(9.8,0,4);return M(RW,`<rect x="8.85" y="2.15" width=".85" height=".85" fill="#FFE88F" stroke="${OL}" stroke-width="1" ${NS}/>`)}),'');
   h+=row('frame','벽 액자',thumbIso(()=>{P(5.5,0,5.8);P(8.5,0,3.1);return M(RW,`<rect x="5.5" y="1.3" width="3.0" height="2.6" fill="${FRAMES[S.f.frame.c||0]}" stroke="${OL}" stroke-width="1.3" ${NS}/><rect x="5.8" y="1.6" width="2.4" height="2.0" fill="#EFE6D6"/>`+(S.img.frame?`<image href="${S.img.frame}" x="5.8" y="1.6" width="2.4" height="2.0" preserveAspectRatio="xMidYMid slice"/>`:''))}),`<div class="cnt-n" style="text-align:left">사진은 '액자' 탭에서 넣어요</div>`)}
  if(t==='frame'){h+=`<div class="lb">벽 액자 속 사진</div><div class="btn-row"><button class="btn" data-a="photo" data-v="frame">${S.img.frame?'사진 바꾸기':'사진 넣기'}</button>${S.img.frame?`<button class="btn l" data-a="rmphoto" data-v="frame">사진 빼기</button>`:''}<button class="btn l" data-a="tog" data-p="f.frame.on">${S.f.frame.on?'액자 숨기기':'액자 다시 걸기'}</button></div><div class="lb">액자 틀</div><div class="sw-row">${FRAMES.map((c,i)=>swc('f.frame.c',i,S.f.frame.c||0,c)).join('')}</div><div class="cnt-n" style="text-align:left;margin-top:10px">넣은 사진은 벽 각도에 맞춰 비스듬히 걸려요</div>`}
 }
 if(SH.kind==='char'){const c=S.ch;
  if(t==='face'){h+=`<div class="lb">피부</div><div class="sw-row">${SKINS.map((x,i)=>swc('ch.skin',i,c.skin,x)).join('')}</div><div class="lb">표정</div><div class="tile-row">${FACES.map(([k,l])=>tile('ch.face',k,c.face,charPv({face:k,prop:c.prop==='headphone'?'none':c.prop},'-30 -104 60 48'),l)).join('')}</div>`}
  if(t==='hair'){h+=`<div class="lb">머리 모양</div><div class="tile-row">${HAIRS.map(([k,l])=>tile('ch.hair',k,c.hair,charPv({hair:k,prop:'none'},HEADVB),l)).join('')}</div><div class="lb">머리 색</div><div class="sw-row">${HCOLS.map((x,i)=>swc('ch.hc',i,c.hc,x)).join('')}</div>`}
  if(t==='wear'){h+=`<div class="lb">상의</div><div class="tile-row">${TOPS.map(([k,l])=>tile('ch.top',k,c.top,charPv({top:k,prop:'none'},'-30 -68 60 48'),l)).join('')}</div><div class="lb">상의 색</div><div class="sw-row">${TCOLS.map((x,i)=>swc('ch.tc',i,c.tc,x)).join('')}</div><div class="lb">하의</div><div class="tile-row">${BOTS.map(([k,l])=>tile('ch.bot',k,c.bot,charPv({bot:k},'-26 -32 52 34'),l)).join('')}</div><div class="lb">하의 색</div><div class="sw-row">${BCOLS.map((x,i)=>swc('ch.bc',i,c.bc,x)).join('')}</div>`}
  if(t==='prop'){h+=`<div class="lb">손에 든 것</div><div class="tile-row">${PROPS.map(([k,l])=>tile('ch.prop',k,c.prop,charPv({prop:k},FULLVB),l)).join('')}</div>`}
  if(t==='pos'){h+=`<div class="frow"><div class="fm"><b>인물 보이기</b><div class="cnt-n" style="text-align:left">끄면 방만 보여요. 말풍선은 방 가운데로 가요</div></div>${tg('ch.on',c.on)}</div><div class="lb">서 있는 곳</div><div class="tile-row">${POSES.map(([k,l,x,y])=>{const pp=(a,b)=>[179+16.021*(a-b),154+9.25*(a+b)].map(r1).join(',');const p=pp(x,y);return tile('ch.pos',k,c.pos,thumb(`<polygon points="${pp(0,0)} ${pp(10,0)} ${pp(10,10)} ${pp(0,10)}" fill="#EDCFA4" stroke="${OL}" stroke-width="3"/><polygon points="${pp(.35,5.05)} ${pp(4.97,5.05)} ${pp(4.97,9.65)} ${pp(.35,9.65)}" fill="#FFE07A" opacity=".8"/><polygon points="${pp(4.9,.15)} ${pp(8.7,.15)} ${pp(8.7,2.05)} ${pp(4.9,2.05)}" fill="#C9A36F" opacity=".8"/><circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="16" fill="#3F3128"/>`,'0 140 358 214'),l)}).join('')}</div>`}
 }
 if(SH.kind==='pal'){h+=`<div class="tile-row" style="grid-template-columns:1fr 1fr">${PALS.map(([n,v],i)=>`<button class="pal${S.pal===i?' on':''}" data-a="set" data-p="pal" data-v="${i}"><span class="pv" style="background:linear-gradient(180deg,${v.bg1},${v.bg2})"><i style="height:30px;background:linear-gradient(180deg,${v.room1},${v.room2});border:1px solid ${v.roomb}"></i><i style="height:12px;margin-top:6px;width:70%;background:${v.card};border:1px solid ${v.line}"></i><i style="height:12px;margin-top:6px;width:45%;background:${v.acc}"></i></span>${n}</button>`).join('')}</div><div class="cnt-n" style="text-align:left;margin-top:10px">방 바깥 배경, 카드, 버튼 색이 함께 바뀌어요</div>`}
 if(SH.kind==='text'){const k=SH.tab,mx=TMAX[k]||24,multi=k==='bubble';h+=`<div class="lb">${TLABEL[k]||'글'}</div>${multi?`<textarea class="txt" id="tIn" rows="2" maxlength="${mx}">${esc(S.t[k]||'')}</textarea><div class="cnt-n">두 줄까지 · 줄바꿈은 엔터</div>`:`<input class="txt" id="tIn" maxlength="${mx}" value="${esc(S.t[k]||'')}">`}<div class="cnt-n"><span id="tN">${(S.t[k]||'').length}</span>/${mx}</div><div class="btn-row" style="margin-top:8px"><button class="btn l" data-a="treset">처음 글로</button></div>`}
 $('shB').innerHTML=h;
 if(SH.kind==='text'){const i=$('tIn');i.oninput=()=>{let v=i.value;if(SH.tab==='bubble')v=v.split('\n').slice(0,2).join('\n');S.t[SH.tab]=v;$('tN').textContent=v.length;drawTexts();drawRoom();save()}}
 if(SH.kind==='room'&&t==='furn'&&SH.scrollTo){const r=$('row-'+SH.scrollTo);SH.scrollTo=null;if(r)setTimeout(()=>{r.scrollIntoView({block:'center'});r.classList.add('sel-flash')},30)}
}
function openText(k){SH.open=true;SH.kind='text';SH.tab=k;SH.tabs=[];$('shT').textContent='글 고치기';SH.render=renderSheet;renderSheet();$('sheet').classList.add('on');$('scrim').classList.add('on');setTimeout(()=>{const i=$('tIn');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},280)}
function setPath(p,v){const ks=p.split('.');let o=S;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=v}
function getPath(p){return p.split('.').reduce((o,k)=>o[k],S)}
$('shTabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;SH.tab=b.dataset.tab;renderSheet();$('shB').scrollTop=0});
$('shB').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='set'){setPath(b.dataset.p,JSON.parse(b.dataset.v));if(b.dataset.p==='pal')drawPal();upd()}
 else if(a==='tog'){const p=b.dataset.p;setPath(p,getPath(p)?0:1);upd()}
 else if(a==='photo'){pick(b.dataset.v)}
 else if(a==='rmphoto'){delete S.img[b.dataset.v];upd();drawImgs()}
 else if(a==='treset'){S.t[SH.tab]=TEXT0[SH.tab];drawTexts();upd()}});
$('shDone').onclick=closeSheet;$('scrim').onclick=closeSheet;

// ===== 사진 =====
let PICK=null;
function pick(k){PICK=k;$('file').click()}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.img[PICK]=cv.toDataURL('image/jpeg',.85);drawImgs();upd();toast(PICK==='frame'?'액자에 사진을 걸었어요':'사진을 넣었어요')};im.src=r.result};r.readAsDataURL(f);e.target.value=''};

// ===== 화면 누르기 =====
const SECMAP={wall:['room','wall'],floor:['room','floor'],rug:['room','floor'],window:['room','win'],frame:['room','frame'],char:['char','face']};
$('app').addEventListener('click',e=>{if(VIEW)return;
 if(e.target.closest('#resetBtn')){if(confirm('처음 모습으로 되돌릴까요?')){S=def();save();drawAll();toast('처음 모습으로 돌아왔어요')}return}
 if(e.target.closest('input')||e.target.closest('.mr-memo button')||e.target.closest('.mr-form button'))return;
 const t=e.target.closest('[data-t]');if(t){e.preventDefault();e.stopPropagation();openText(t.dataset.t);return}
 const ph=e.target.closest('[data-photo]');if(ph){pick(ph.dataset.photo);return}
 const sc=e.target.closest('[data-sec]');if(sc){const k=sc.dataset.sec;const m=SECMAP[k];if(m)openSheet(m[0],m[1]);else{SH.scrollTo=k;openSheet('room','furn')}}},true);
$('knockBtn').addEventListener('click',e=>{if(!VIEW&&e.target.closest('[data-t]'))return;S.knock++;drawKnock();save();const r=$('knockBtn').getBoundingClientRect();const d=document.createElement('div');d.className='pop';d.textContent='똑똑!';d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top-10)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)});
$('gbBtn').onclick=()=>{const v=$('gbIn').value.trim();if(!v){toast('한 줄 적어주세요');return}const n=new Date();S.gb.push({m:v.slice(0,60),d:(n.getMonth()+1)+'.'+n.getDate()});$('gbIn').value='';drawGb();save();toast('방명록을 남겼어요')};
$('ansBtn').onclick=()=>{if(!$('ansIn').value.trim()){toast('답을 적어주세요');return}$('ansIn').value='';toast('메모에 답을 붙였어요')};
$('bRoom').onclick=()=>SH.open&&SH.kind==='room'?closeSheet():openSheet('room');
$('bChar').onclick=()=>SH.open&&SH.kind==='char'?closeSheet():openSheet('char');
$('bPal').onclick=()=>SH.open&&SH.kind==='pal'?closeSheet():openSheet('pal');
function setView(v){VIEW=v;closeSheet();$('app').classList.toggle('edit',!v);document.body.classList.toggle('view',v);$('app').classList.toggle('view',v);$('dock').classList.toggle('view',v);toast(v?'방문자가 보는 화면이에요':'다시 꾸밀 수 있어요')}
$('bView').onclick=()=>setView(true);$('bBack').onclick=()=>setView(false);
drawAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>drawRoom());
</script></body></html>
