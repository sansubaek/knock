<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>knock 살아있는 방 v3</title>
<style>
:root{--ink:#4a3528;--paper:#fff8ea;--u:3.9px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:grid;place-items:center}
html,body{margin:0;background:#2b241f;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);overscroll-behavior:none}
.stage{position:relative;height:min(100dvh,calc(min(100vw,460px)*1484/828));aspect-ratio:828/1484;margin:0 auto;overflow:hidden;background:#e9dcc3;user-select:none;-webkit-user-select:none;touch-action:manipulation;font-size:calc(var(--u)*3.4)}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s}
.view.on{opacity:1;pointer-events:auto}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s;-webkit-user-drag:none;pointer-events:none}
img{-webkit-user-drag:none;user-select:none}
.pill{background:rgba(255,248,234,.93);border:calc(var(--u)*.45) solid var(--ink);border-radius:999px;padding:calc(var(--u)*1.1) calc(var(--u)*2.6);font-weight:800;line-height:1.2;white-space:nowrap}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--u)*2.4) calc(var(--u)*2.6);display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--u)*1.5);z-index:3000;pointer-events:none}
.hud .r{display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*1.2)}
.cur{display:flex;align-items:center;gap:calc(var(--u)*1.2)}
.cur img{height:calc(var(--u)*5);width:auto;display:block}
.dots{display:flex;gap:calc(var(--u)*.9);padding:calc(var(--u)*1.3) calc(var(--u)*2)}
.dots i{width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);border-radius:50%;border:calc(var(--u)*.35) solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
nav{position:absolute;left:0;right:0;bottom:calc(var(--u)*2.4);display:flex;justify-content:center;gap:calc(var(--u)*1.6);z-index:3000}
nav button,.btn{appearance:none;font:inherit;color:var(--ink);cursor:pointer}
nav button.on{background:var(--ink);color:var(--paper)}
.hint{position:absolute;left:4%;right:4%;top:calc(var(--u)*19.5);z-index:2900;text-align:center;background:rgba(255,248,234,.9);border-radius:calc(var(--u)*3);padding:calc(var(--u)*1.6) calc(var(--u)*2.4);font-size:calc(var(--u)*3.1);line-height:1.45;font-weight:600;pointer-events:none;transition:opacity .4s}
.hint b{font-weight:900}
.hot{position:absolute;cursor:pointer;z-index:1500}
.spr{position:absolute;transform:translate(-50%,-100%);pointer-events:none;transition:filter .5s}
.spr img{display:block;height:100%;width:auto}
.tapme{pointer-events:auto;cursor:pointer}
#room.night .spr{filter:brightness(.5) saturate(.8)}
#room.night.lampon .spr{filter:brightness(.84)}
#room.night #itLights,#room.night.lampon #itLights{filter:drop-shadow(0 0 calc(var(--u)*2) rgba(255,214,130,.8))}
#dayglow{position:absolute;left:88%;top:42.5%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,206,110,.75) 0,rgba(255,206,110,.28) 30%,transparent 62%);mix-blend-mode:soft-light;opacity:0;transition:opacity .4s;pointer-events:none}
#dayglow2{position:absolute;left:88%;top:42.2%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,240,180,.85) 0,transparent 68%);opacity:0;transition:opacity .4s;pointer-events:none}
#char{z-index:800;transition:filter .5s}
#charIn{height:100%;transform-origin:50% 100%}
#charIn.hop{animation:hop .45s ease-out}
@keyframes hop{35%{transform:translateY(-14%) scale(.97,1.04)}70%{transform:translateY(0) scale(1.03,.97)}}
#charIn.walk{animation:walk .3s linear infinite}
@keyframes walk{50%{transform:translateY(-3%) rotate(2.5deg)}}
#charIn.groove{animation:groove .9s ease-in-out infinite}
@keyframes groove{50%{transform:rotate(-4deg) translateY(-1.5%)}}
#charIn.breath{animation:breath 3.2s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.015,.985)}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translate(-50%,-100%) scale(.2)}100%{transform:translate(-50%,-100%) scale(1)}}
.sway img{transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2deg)}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fffdf6;border:calc(var(--u)*.45) solid var(--ink);border-radius:calc(var(--u)*3.4);padding:calc(var(--u)*1.5) calc(var(--u)*2.6);font-weight:800;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:2500}
.bubble.on{opacity:1}
.bubble:after{content:"";position:absolute;left:50%;bottom:calc(var(--u)*-1.25);width:calc(var(--u)*2);height:calc(var(--u)*2);background:#fffdf6;border-right:calc(var(--u)*.45) solid var(--ink);border-bottom:calc(var(--u)*.45) solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.fx{position:absolute;pointer-events:none;font-weight:900;font-size:calc(var(--u)*4.4);color:#fffdf6;-webkit-text-stroke:calc(var(--u)*.9) var(--ink);paint-order:stroke fill;animation:up 1.1s ease-out forwards;transform:translate(-50%,-50%);z-index:2600;white-space:nowrap}
@keyframes up{to{transform:translate(-50%,-240%);opacity:0}}
.fish{position:absolute;width:34%;animation:swim 3.4s ease-in-out infinite alternate}
.fish img{width:100%;display:block}
@keyframes swim{from{transform:translateX(-18%)}to{transform:translateX(42%) scaleX(1)}}
/* door */
#doorTap{left:17%;top:24%;width:66%;height:63%}
#doorTag{position:absolute;left:42.2%;top:39.6%;width:15.6%;height:6%;display:grid;place-items:center;pointer-events:none}
#doorTag svg{height:82%;width:auto}
#doorWrap{position:absolute;inset:0;transform-origin:50% 55%;transition:transform .75s cubic-bezier(.6,0,.9,.6),opacity .75s}
#doorWrap.kn{animation:kn .16s linear 2}
@keyframes kn{50%{transform:translateX(.9%)}}
#doorWrap.open{transform:scale(2.6);opacity:0}
#pulse{position:absolute;left:50%;top:66%;width:26%;aspect-ratio:1;border-radius:50%;border:calc(var(--u)*.8) solid #fffdf6;transform:translate(-50%,-50%);animation:pulse 1.4s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.5);opacity:.95}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
#tapTxt{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);color:#fffdf6;font-weight:900;font-size:calc(var(--u)*4);-webkit-text-stroke:calc(var(--u)*.8) var(--ink);paint-order:stroke fill;pointer-events:none;white-space:nowrap}
#plate{position:absolute;left:50%;top:21.5%;transform:translateX(-50%);font-size:calc(var(--u)*4.4)}
/* pond */
#bobber{position:absolute;left:50%;top:46%;height:7.2%;transform:translate(-50%,-60%);opacity:0;transition:opacity .2s}
#bobber img{height:100%;display:block}
#bobber.in{opacity:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-52%) rotate(4deg)}}
#bobber.bite{animation:bite .22s ease-in-out infinite}
@keyframes bite{50%{transform:translate(-50%,-30%) rotate(-8deg)}}
.ring{position:absolute;left:50%;top:46%;width:18%;aspect-ratio:2.2;border-radius:50%;border:calc(var(--u)*.5) solid rgba(255,255,255,.85);transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none}
.ring.go{animation:ring 1.5s ease-out infinite}
.ring.r2.go{animation-delay:.5s}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
#bang{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(0);font-size:calc(var(--u)*16);font-weight:900;color:#ffd24a;-webkit-text-stroke:calc(var(--u)*1.4) var(--ink);paint-order:stroke fill;transition:transform .12s;pointer-events:none}
#bang.on{transform:translate(-50%,-50%) scale(1)}
#castBtn{position:absolute;left:50%;bottom:calc(var(--u)*13);transform:translateX(-50%);font-size:calc(var(--u)*4.2);padding:calc(var(--u)*2.2) calc(var(--u)*6);z-index:2950;background:#ffd98a}
#baitMore{position:absolute;left:50%;bottom:calc(var(--u)*25);transform:translateX(-50%);z-index:2950;font-size:calc(var(--u)*2.9);background:rgba(255,248,234,.8);border-style:dashed}
#catch{position:absolute;left:50%;top:40%;width:44%;transform:translate(-50%,-50%) scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:2400;text-align:center}
#catch.on{transform:translate(-50%,-50%) scale(1)}
#catch img{width:100%;filter:drop-shadow(0 calc(var(--u)*1) 0 rgba(74,53,40,.25))}
#catch div{margin-top:calc(var(--u)*1.5);display:inline-block}
/* alley */
#alley{background:#e9dcc3;overflow:hidden}
#alleyTop{position:absolute;left:5%;right:5%;top:20.5%;font-weight:600;line-height:1.5}
#alleyTop b{display:block;font-size:calc(var(--u)*5.4);font-weight:900}
#houses{position:absolute;left:4%;right:4%;top:32%;bottom:11%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(var(--u)*2.4)}
.house{position:relative;border:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*3);overflow:hidden;padding:0;background:#fff8ea;cursor:pointer;font:inherit;color:inherit;text-align:left}
.house img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 52%}
.house.dark img{filter:brightness(.55) saturate(.8)}
.house .lit{position:absolute;right:6%;top:6%;width:9%;aspect-ratio:1;border-radius:50%;background:#ffd24a;border:calc(var(--u)*.4) solid var(--ink);box-shadow:0 0 calc(var(--u)*3) #ffd24a}
.house .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(255,248,234,.94);border-top:calc(var(--u)*.45) solid var(--ink);padding:calc(var(--u)*1.4) calc(var(--u)*2.2);line-height:1.35}
.house .nm b{font-weight:900;font-size:calc(var(--u)*3.8);display:block}
.house .nm span{font-size:calc(var(--u)*2.7);font-weight:600;opacity:.8}
/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(105%);background:#fffdf6;border-top:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*5) calc(var(--u)*5) 0 0;padding:calc(var(--u)*4) calc(var(--u)*4.5) calc(var(--u)*5);transition:transform .28s;z-index:3500}
.sheet.on{transform:translateY(0)}
.sheet h3{margin:0 0 calc(var(--u)*2.4);font-size:calc(var(--u)*4.4);display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:none;font:inherit;font-size:calc(var(--u)*3.2);color:inherit;opacity:.65;font-weight:700;cursor:pointer}
.sheet ul{list-style:none;margin:0 0 calc(var(--u)*2.5);padding:0;max-height:calc(var(--u)*46);overflow:auto}
.sheet li{padding:calc(var(--u)*2) 0;border-bottom:1px solid rgba(74,53,40,.15);font-weight:600}
.sheet li b{margin-right:calc(var(--u)*1.6);font-weight:900}
.sheet form{display:flex;gap:calc(var(--u)*2)}
.sheet input{flex:1;min-width:0;border:calc(var(--u)*.45) solid var(--ink);border-radius:999px;padding:calc(var(--u)*2) calc(var(--u)*3);font:inherit;font-size:16px;outline:0;background:#fff;color:var(--ink)}
.shopRow{display:grid;grid-template-columns:calc(var(--u)*17) 1fr auto;gap:calc(var(--u)*3);align-items:center;padding:calc(var(--u)*2) 0;border-bottom:1px solid rgba(74,53,40,.15)}
.shopRow .th{height:calc(var(--u)*13);display:grid;place-items:center}
.shopRow .th img{max-width:100%;max-height:calc(var(--u)*13);object-fit:contain}
.shopRow b{display:block;font-weight:900}
.shopRow small{font-size:calc(var(--u)*2.8);opacity:.75;font-weight:600}
.shopRow .btn{display:flex;align-items:center;gap:calc(var(--u)*1)}
.shopRow .btn img{height:calc(var(--u)*4.2)}
.btn.off{opacity:.45}
.btn.own{background:var(--ink);color:var(--paper)}
#veil{position:absolute;inset:0;background:#fff8ea;opacity:0;pointer-events:none;transition:opacity .5s;z-index:2800}
#veil.on{opacity:1}

/* ===== v3 ===== */
.av svg{height:100%;width:auto;display:block;overflow:visible}
.av .flip{transform:scaleX(-1);transform-origin:50% 50%}
.av .lg,.av .am{transform-box:fill-box;transform-origin:50% 0}
.walking .lgL{animation:lgA .34s ease-in-out infinite}
.walking .lgR{animation:lgA .34s ease-in-out infinite reverse}
.walking .amL{animation:lgA .34s ease-in-out infinite reverse}
.walking .amR{animation:lgA .34s ease-in-out infinite}
@keyframes lgA{0%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}100%{transform:rotate(22deg)}}
.walking .bodyG{animation:bob .17s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2.5px)}}
#decoBtn{position:absolute;right:3%;bottom:calc(var(--u)*13);z-index:2950;background:#ffd98a;font-size:calc(var(--u)*3.2)}
#petBar{position:absolute;left:3%;bottom:calc(var(--u)*13);z-index:2950;display:flex;gap:calc(var(--u)*1.2);align-items:center;font-size:calc(var(--u)*3)}
#petBar .meter{width:calc(var(--u)*14);height:calc(var(--u)*2);border:calc(var(--u)*.4) solid var(--ink);border-radius:9px;overflow:hidden;background:#fff}
#petBar .meter i{display:block;height:100%;background:#f29a8e;transition:width .4s}
.pet{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:700}
.pet svg{height:100%;width:auto;display:block;overflow:visible}
.pet.walking .pl1{animation:plg .26s ease-in-out infinite}
.pet.walking .pl2{animation:plg .26s ease-in-out infinite reverse}
@keyframes plg{50%{transform:translateY(-3px)}}
.pet .tail{transform-box:fill-box;transform-origin:0 100%;animation:wag 1.2s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(-14deg)}}
#bed{position:absolute;left:26%;top:80%;width:38%;transform:translate(-50%,-100%);cursor:pointer;z-index:760}
#bed svg{width:100%;height:auto;display:block}
#bed .sleeper{display:none}#bed.sleep .sleeper{display:inline}
.zz{position:absolute;font-weight:900;color:#fffdf6;-webkit-text-stroke:calc(var(--u)*.6) var(--ink);paint-order:stroke fill;font-size:calc(var(--u)*4.4);pointer-events:none;animation:zz 2s ease-out infinite;z-index:2600}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(30%,-180%) scale(1.1);opacity:0}}
.slot{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.slot svg{height:100%;width:auto;display:block}
.slot.empty{width:0;height:0}
#deco .tabs{display:flex;gap:calc(var(--u)*1.4);margin-bottom:calc(var(--u)*2.4);flex-wrap:wrap}
#deco .tabs button.on{background:var(--ink);color:var(--paper)}
#decoBody{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*2);max-height:calc(var(--u)*62);overflow:auto}
.opt{border:calc(var(--u)*.45) solid var(--ink);border-radius:calc(var(--u)*3);background:#fff8ea;padding:calc(var(--u)*1.6);text-align:center;font:inherit;font-size:calc(var(--u)*2.9);font-weight:700;color:var(--ink);cursor:pointer}
.opt.sel{background:#ffd98a}
.opt .pv{height:calc(var(--u)*16);display:grid;place-items:center}
.opt .pv svg{height:100%;width:auto;max-width:100%}
.slotRow{grid-column:1/-1;display:flex;align-items:center;gap:calc(var(--u)*1.5);flex-wrap:wrap;padding:calc(var(--u)*1.4) 0;border-bottom:1px solid rgba(74,53,40,.15)}
.slotRow b{min-width:calc(var(--u)*16);font-weight:900}
.slotRow button{font-size:calc(var(--u)*2.8);padding:calc(var(--u)*.8) calc(var(--u)*2)}
.slotRow button.on{background:var(--ink);color:var(--paper)}
/* yard */
#yard{background:linear-gradient(#bfe0ee 0,#d9eef2 26%,#cfe3b4 34%,#b9d79a 60%,#a9cc89 100%);overflow:hidden}
#yard .fence{position:absolute;left:0;right:0;top:30%;height:6%;background:repeating-linear-gradient(90deg,#f3e3c3 0 4%,transparent 4% 7%);border-bottom:calc(var(--u)*.6) solid #c9ad80}
#yard .fence:before{content:"";position:absolute;left:0;right:0;top:35%;height:18%;background:#f3e3c3;border-top:calc(var(--u)*.4) solid #c9ad80;border-bottom:calc(var(--u)*.4) solid #c9ad80}
#yHouse{position:absolute;left:4%;top:14%;width:40%;cursor:pointer;z-index:300}
#yHouse svg{width:100%;height:auto;display:block}
#yPond{position:absolute;left:55%;top:58%;width:42%;cursor:pointer;z-index:400}
#yPond svg{width:100%;height:auto;display:block}
.ytag{position:absolute;transform:translate(-50%,0);font-size:calc(var(--u)*3);z-index:2700;pointer-events:none}
#yTree{position:absolute;left:84%;top:40%;width:24%;transform:translate(-50%,-100%);pointer-events:none;z-index:380}
#yTree svg{width:100%;height:auto;display:block}
.flower{position:absolute;width:3%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 calc(var(--u)*.5) #f5c35b inset;pointer-events:none}
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- 문 -->
  <div class="view on" id="door">
    <div id="doorWrap">
      <img class="bg" data-k="door" alt="">
      <div id="doorTag"><svg viewBox="0 0 40 40"><g fill="#4a3528"><rect x="2" y="2" width="12" height="12"/><rect x="26" y="2" width="12" height="12"/><rect x="2" y="26" width="12" height="12"/><rect x="18" y="4" width="4" height="4"/><rect x="18" y="16" width="6" height="6"/><rect x="28" y="20" width="4" height="4"/><rect x="34" y="28" width="4" height="10"/><rect x="20" y="30" width="10" height="4"/><rect x="4" y="18" width="4" height="4"/></g><g fill="#fffdf6"><rect x="5" y="5" width="6" height="6"/><rect x="29" y="5" width="6" height="6"/><rect x="5" y="29" width="6" height="6"/></g><g fill="#4a3528"><rect x="7" y="7" width="2" height="2"/><rect x="31" y="7" width="2" height="2"/><rect x="7" y="31" width="2" height="2"/></g></svg></div>
      <div class="pill" id="plate">두부네</div>
      <div id="pulse"></div><div id="tapTxt">여기를 톡톡</div>
    </div>
    <div class="hot" id="doorTap"></div>
  </div>

  <!-- 방 -->
  <div class="view" id="room">
    <img class="bg" data-k="room_day" alt="">
    <img class="bg" id="bgNight" data-k="room_night" style="opacity:0" alt="">
    <img class="bg" id="bgLamp" data-k="room_lamp" style="opacity:0" alt="">
    <div id="dayglow"></div><div id="dayglow2"></div>
    <div class="spr" id="itLights" style="left:34%;top:26.8%;height:14.4%;display:none;z-index:10"><img data-k="i_lights" alt=""></div>
    <div class="spr" id="itFrame" style="left:68%;top:29.5%;height:8.6%;display:none;z-index:10"><img data-k="i_frame" alt=""></div>
    <div class="spr" id="itCat" style="left:67%;top:79.5%;height:9.4%;display:none;z-index:795"><img data-k="i_cat" alt=""></div>
    <div id="bowlFish" style="position:absolute;left:11.4%;top:45.8%;width:11.6%;height:4.6%;pointer-events:none;z-index:20"></div>
    <div class="hot" id="hWin" style="left:11%;top:16%;width:33%;height:25%"></div>
    <div class="hot" id="hBowl" style="left:8.5%;top:41.8%;width:17.5%;height:10%"></div>
    <div class="hot" id="hDeck" style="left:53%;top:32.5%;width:28%;height:12%"></div>
    <div class="hot" id="hLamp" style="left:81%;top:37.5%;width:14%;height:25%"></div>
    <div class="hot" id="hMail" style="left:78%;top:80%;width:17%;height:15%"></div>
    <div class="spr sway tapme" id="plant" style="left:14.5%;top:96.6%;z-index:966"><img id="plantImg" alt=""></div>
    <div class="slot empty" id="slotA"></div><div class="slot empty" id="slotB"></div><div class="slot empty" id="slotC"></div><div class="slot empty" id="slotD"></div>
    <div id="bed"></div>
    <div class="pet" id="petRoom"></div>
    <div class="spr tapme av" id="char" style="left:50%;top:80%"><div id="charIn" class="breath"><img id="charImg" alt="" style="display:none"><div id="charSvg" style="height:100%"></div></div></div>
    <div class="bubble" id="bubble"></div>
    <button class="pill btn" id="decoBtn">꾸미기</button>
  </div>

  <!-- 낚시 -->
  <div class="view" id="pond">
    <img class="bg" data-k="pond" alt="">
    <div class="ring" id="ring1"></div><div class="ring r2" id="ring2"></div>
    <div id="bobber"><img data-k="bobber" alt=""></div>
    <div id="bang">!</div>
    <div id="catch"><img id="catchImg" alt=""><div class="pill" id="catchTxt"></div></div>
