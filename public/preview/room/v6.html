<script>/* v6 storage migration: copy v5 progress once */
(function(){try{[['knock_room_v6','knock_room_v5'],['knock_room_v6b','knock_room_v4b'],['knock_yard_v6','knock_yard_v5'],['knock_wallet_v6','knock_wallet_v5']].forEach(function(p){ if(localStorage.getItem(p[0])==null&&localStorage.getItem(p[1])!=null) localStorage.setItem(p[0],localStorage.getItem(p[1])); });}catch(e){}})();
window.__errs=[];addEventListener('error',function(e){window.__errs.push(String(e.message))});</script>
<style>
:root{--ink:#4a3528;--paper:#fff8ea;--u:3.9px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.pill{background:rgba(255,248,234,.93);border:calc(var(--u)*.45) solid var(--ink);border-radius:999px;padding:calc(var(--u)*1.1) calc(var(--u)*2.6);font-weight:800;line-height:1.2;white-space:nowrap}

.dots i{width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);border-radius:50%;border:calc(var(--u)*.35) solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
nav{position:absolute;left:0;right:0;bottom:calc(var(--u)*2.4);display:flex;justify-content:center;gap:calc(var(--u)*1.6);z-index:3000}
nav button,.btn{appearance:none;font:inherit;color:var(--ink);cursor:pointer}

.hint{position:absolute;left:4%;right:4%;top:calc(var(--u)*19.5);z-index:2900;text-align:center;background:rgba(255,248,234,.9);border-radius:calc(var(--u)*3);padding:calc(var(--u)*1.6) calc(var(--u)*2.4);font-size:calc(var(--u)*3.1);line-height:1.45;font-weight:600;pointer-events:none;transition:opacity .4s}

.hot{position:absolute;cursor:pointer;z-index:1500}
.spr{position:absolute;transform:translate(-50%,-100%);pointer-events:none;transition:filter .5s}
.spr img{display:block;height:100%;width:auto}
.tapme{pointer-events:auto;cursor:pointer}
#room.night .spr{filter:brightness(.5) saturate(.8)}

#dayglow{position:absolute;left:88%;top:42.5%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,206,110,.75) 0,rgba(255,206,110,.28) 30%,transparent 62%);mix-blend-mode:soft-light;opacity:0;transition:opacity .4s;pointer-events:none}

@keyframes hop{35%{transform:translateY(-14%) scale(.97,1.04)}70%{transform:translateY(0) scale(1.03,.97)}}

.fx{position:absolute;pointer-events:none;font-weight:900;font-size:calc(var(--u)*4.4);color:#fffdf6;-webkit-text-stroke:calc(var(--u)*.9) var(--ink);paint-order:stroke fill;animation:up 1.1s ease-out forwards;transform:translate(-50%,-50%);z-index:2600;white-space:nowrap}

/* door */
#doorTap{left:17%;top:24%;width:66%;height:63%}

#plate{position:absolute;left:50%;top:21.5%;transform:translateX(-50%);font-size:calc(var(--u)*4.4)}
/* pond */
#bobber{position:absolute;left:50%;top:46%;height:7.2%;transform:translate(-50%,-60%);opacity:0;transition:opacity .2s}
#bobber img{height:100%;display:block}
#bobber.in{opacity:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-52%) rotate(4deg)}}
#bobber.bite{animation:bite .22s ease-in-out infinite}
@keyframes bite{50%{transform:translate(-50%,-30%) rotate(-8deg)}}
.ring{position:absolute;left:50%;top:46%;width:18%;aspect-ratio:2.2;border-radius:50%;border:calc(var(--u)*.5) solid rgba(255,255,255,.85);transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none}
.ring.go{animation:ring 1.5s ease-out infinite}
.ring.r2.go{animation-delay:.5s}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
#bang{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(0);font-size:calc(var(--u)*16);font-weight:900;color:#ffd24a;-webkit-text-stroke:calc(var(--u)*1.4) var(--ink);paint-order:stroke fill;transition:transform .12s;pointer-events:none}
#bang.on{transform:translate(-50%,-50%) scale(1)}
#castBtn{position:absolute;left:50%;bottom:calc(var(--u)*13);transform:translateX(-50%);font-size:calc(var(--u)*4.2);padding:calc(var(--u)*2.2) calc(var(--u)*6);z-index:2950;background:#ffd98a}
#baitMore{position:absolute;left:50%;bottom:calc(var(--u)*25);transform:translateX(-50%);z-index:2950;font-size:calc(var(--u)*2.9);background:rgba(255,248,234,.8);border-style:dashed}
#catch{position:absolute;left:50%;top:40%;width:44%;transform:translate(-50%,-50%) scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:2400;text-align:center}

#houses{position:absolute;left:4%;right:4%;top:32%;bottom:11%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(var(--u)*2.4)}
.house{position:relative;border:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*3);overflow:hidden;padding:0;background:#fff8ea;cursor:pointer;font:inherit;color:inherit;text-align:left}
.house img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 52%}
.house.dark img{filter:brightness(.55) saturate(.8)}

.house .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(255,248,234,.94);border-top:calc(var(--u)*.45) solid var(--ink);padding:calc(var(--u)*1.4) calc(var(--u)*2.2);line-height:1.35}
.house .nm b{font-weight:900;font-size:calc(var(--u)*3.8);display:block}
.house .nm span{font-size:calc(var(--u)*2.7);font-weight:600;opacity:.8}
/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(105%);background:#fffdf6;border-top:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*5) calc(var(--u)*5) 0 0;padding:calc(var(--u)*4) calc(var(--u)*4.5) calc(var(--u)*5);transition:transform .28s;z-index:3500}

.sheet form{display:flex;gap:calc(var(--u)*2)}
.sheet input{flex:1;min-width:0;border:calc(var(--u)*.45) solid var(--ink);border-radius:999px;padding:calc(var(--u)*2) calc(var(--u)*3);font:inherit;font-size:16px;outline:0;background:#fff;color:var(--ink)}
.shopRow{display:grid;grid-template-columns:calc(var(--u)*17) 1fr auto;gap:calc(var(--u)*3);align-items:center;padding:calc(var(--u)*2) 0;border-bottom:1px solid rgba(74,53,40,.15)}

.btn.off{opacity:.45}

.furn{position:absolute;transform:translate(-50%,-100%);pointer-events:none;transition:filter .5s}
.furn>img:first-child{display:block;width:100%;height:auto}

#bgEmpty{transition:filter .5s}
#room.night #bgEmpty,#room.night .furn{filter:brightness(.45) saturate(.75)}

#charYIn{height:100%;transform-origin:50% 100%}

.pet img{transition:none}.pet.pwalk{animation:pw .28s linear infinite}
@keyframes pw{50%{transform:translate(-50%,-103%)}}
#petBar{position:absolute;left:3%;bottom:calc(var(--u)*13.5);display:flex;gap:calc(var(--u)*1.4);align-items:center;z-index:3000;font-size:calc(var(--u)*2.9)}
#petMeter{width:calc(var(--u)*14);height:calc(var(--u)*2);border:calc(var(--u)*.4) solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;display:inline-block;vertical-align:middle;margin-left:calc(var(--u)*1)}
#petMeter i{display:block;height:100%;background:#e98a8a}

#decoTabs{display:flex;gap:calc(var(--u)*1.4);flex-wrap:wrap;margin-bottom:calc(var(--u)*3)}
.dtab{font-size:calc(var(--u)*3);cursor:pointer}.dtab.on{background:var(--ink);color:var(--paper)}

.dcard{appearance:none;font:inherit;color:inherit;background:#fff8ea;border:calc(var(--u)*.45) solid rgba(74,53,40,.35);border-radius:calc(var(--u)*3);padding:calc(var(--u)*1.6);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1);font-weight:800;font-size:calc(var(--u)*2.9);cursor:pointer}

.dth{height:calc(var(--u)*16);display:grid;place-items:center}.dth img{max-height:calc(var(--u)*16);max-width:100%}
.drow{grid-column:1/-1;display:flex;gap:calc(var(--u)*2)}.drow .btn{flex:1;font-size:calc(var(--u)*2.9);padding:calc(var(--u)*1.6)}
.dnote{grid-column:1/-1;margin:0;font-size:calc(var(--u)*2.9);opacity:.75}
#veil{position:absolute;inset:0;background:#fff8ea;opacity:0;pointer-events:none;transition:opacity .5s;z-index:2800}
#veil.on{opacity:1}
</style>

<body>
<div class="stage" id="stage">

  <!-- 문 -->
  <div class="view on" id="door">
    <div id="doorWrap">
      <img class="bg" data-k="door" alt="">
      <div id="doorTag"><svg viewBox="0 0 40 40"><g fill="#4a3528"><rect x="2" y="2" width="12" height="12"/><rect x="26" y="2" width="12" height="12"/><rect x="2" y="26" width="12" height="12"/><rect x="18" y="4" width="4" height="4"/><rect x="18" y="16" width="6" height="6"/><rect x="28" y="20" width="4" height="4"/><rect x="34" y="28" width="4" height="10"/><rect x="20" y="30" width="10" height="4"/><rect x="4" y="18" width="4" height="4"/></g><g fill="#fffdf6"><rect x="5" y="5" width="6" height="6"/><rect x="29" y="5" width="6" height="6"/><rect x="5" y="29" width="6" height="6"/></g><g fill="#4a3528"><rect x="7" y="7" width="2" height="2"/><rect x="31" y="7" width="2" height="2"/><rect x="7" y="31" width="2" height="2"/></g></svg></div>

    <div id="furnLayer"></div>
    <div class="spr pet tapme" id="petR" style="display:none"><img alt=""></div>
    <div class="spr" id="itLights" style="left:34%;top:26.8%;height:14.4%;display:none;z-index:10"><img data-k="i_lights" alt=""></div>
    <div class="spr" id="itFrame" style="left:68%;top:29.5%;height:8.6%;display:none;z-index:10"><img data-k="i_frame" alt=""></div>

    <div class="hot" id="hLamp" style="left:81%;top:37.5%;width:14%;height:25%"></div>

    <div class="spr sway tapme" id="plant" style="left:14.5%;top:96.6%;z-index:966"><img id="plantImg" alt=""></div>

  <!-- 마당 -->
  <div class="view" id="yard">
    <img class="bg" data-k="yard" alt="">
    <div class="hot" id="hHouse" style="left:2%;top:19%;width:20%;height:22%"></div>
    <div class="hot" id="hPond" style="left:56%;top:50%;width:44%;height:21%"></div>
    <div class="spr pet tapme" id="petY" style="display:none"><img alt=""></div>
    <div class="spr tapme" id="charY" style="left:30%;top:70%"><div id="charYIn" class="breath"><img id="charYImg" alt=""></div></div>
    <div class="pill" style="position:absolute;left:60%;top:66%;font-size:calc(var(--u)*2.8);z-index:900;pointer-events:none">연못 · 낚시</div>
  </div>

  <!-- 낚시 -->
  <div class="view" id="pond">
    <img class="bg" data-k="pond" alt="">

  <!-- 골목 -->
  <div class="view" id="alley">
    <div id="alleyTop"><b>우리 골목</b>실제로 만나서 노크한 친구만 이웃이 돼. 불 켜진 집은 오늘 방이 바뀐 집.</div>
    <div id="houses"></div>
  </div>

  <div id="petBar" style="display:none"><span class="pill" id="petName">고양이</span><span class="pill">기분<span id="petMeter"><i></i></span></span><button class="pill btn" id="feedBtn">밥 주기</button></div>
  <button class="pill btn" id="decoBtn" style="display:none">꾸미기</button>
  <div id="veil"></div>
  <div class="hud">
    <div class="pill" id="where">두부네 문 앞</div>
    <div class="r">
      <div class="pill cur"><img data-k="coin" alt=""><span id="coins">12</span><span style="opacity:.35">|</span><span>미끼 <span id="bait">3</span></span></div>
      <div class="pill dots" id="dots"></div>
    </div>
  </div>
  <div class="hint" id="hint"></div>
  <nav>
    <button class="pill" data-v="door">문</button>
    <button class="pill" data-v="room">방</button>
    <button class="pill" data-v="yard">마당</button>
    <button class="pill" data-v="alley">골목</button>
    <button class="pill" data-v="shop">상점</button>
  </nav>

  <div class="sheet" id="gb">
    <h3><span id="gbT">방명록</span><button id="gbX">닫기</button></h3>
    <ul id="notes"></ul>
    <form id="noteF"><input id="noteI" maxlength="30" placeholder="한 줄 남기기"><button class="pill btn own">남기기</button></form>
  </div>
  <div class="sheet" id="deco">
    <h3><span>꾸미기</span><button id="decoX">닫기</button></h3>
    <div id="decoTabs"></div><div id="decoBody"></div>
  </div>
  <div class="sheet" id="shop">
    <h3><span>꾸미기 상점</span><button id="shopX">닫기</button></h3>
    <div id="shopList"></div>
    <p style="margin:calc(var(--u)*3) 0 0;font-size:calc(var(--u)*2.9);font-weight:600;opacity:.75;line-height:1.5">코인은 낚시와 화분 수확으로 벌어. 미끼는 노크를 받거나 친구 문을 두드리면 생겨.</p>
  </div>
</div>

<script>
const IMG={"bobber": "v6a/o_bobber.webp", "c_dizzy": "v6a/o_c_dizzy.webp", "c_jump": "v6a/o_c_jump.webp", "c_sleep": "v6a/o_c_sleep.webp", "c_stand": "v6a/o_c_stand.webp", "coin": "v6a/o_coin.webp", "door": "v6a/o_door.webp", "f_blue": "v6a/o_f_blue.webp", "f_gold": "v6a/o_f_gold.webp", "f_puff": "v6a/o_f_puff.webp", "i_cat": "v6a/o_i_cat.webp", "i_frame": "v6a/o_i_frame.webp", "i_lights": "v6a/o_i_lights.webp", "p1": "v6a/o_p1.webp", "p2": "v6a/o_p2.webp", "p3": "v6a/o_p3.webp", "p4": "v6a/o_p4.webp", "pond": "v6a/o_pond.webp", "room_day": "v6a/o_room_day.webp", "room_lamp": "v6a/o_room_lamp.webp", "room_night": "v6a/o_room_night.webp"};
const META={"c_stand": [253, 430], "c_jump": [306, 438], "c_sleep": [255, 384], "c_dizzy": [303, 438], "p1": [155, 177], "p2": [162, 260], "p3": [283, 400], "p4": [287, 400], "i_cat": [330, 258], "i_lights": [720, 372], "i_frame": [210, 264], "coin": [96, 99], "f_blue": [210, 156], "f_gold": [230, 174], "f_puff": [220, 177], "bobber": [110, 170]};
const $=s=>document.querySelector(s), stage=$('#stage');
document.querySelectorAll('img[data-k]').forEach(i=>i.src=IMG[i.dataset.k]);
function fit(){ document.documentElement.style.setProperty('--u',(stage.clientWidth/100)+'px'); }
addEventListener('resize',fit); fit();
let lastDown=0; document.addEventListener('pointerdown',()=>lastDown=Date.now(),true);
function on(el,fn){ el.addEventListener('pointerdown',fn); el.addEventListener('click',e=>{ if(Date.now()-lastDown>700) fn(e); }); }
const pct=e=>{const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100}};
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

const FRIENDS=[
 {id:'dubu',name:'두부',me:true,status:'과제 중',lit:true,night:false,lamp:false,water:3,items:[],
  lines:['왔어?','방명록 쓰고 가','오늘 좀 피곤함','화분에 물 좀 줘','어항 누르면 낚시터 가'],
  notes:[['민지','어제 왔다 감 ㅎ'],['현우','케이스 어디서 샀냐'],['익명','방 깔끔하네']]},
 {id:'minji',name:'민지',status:'알바 중',lit:true,night:true,lamp:true,water:7,items:['lights','cat'],fish:['f_gold','f_blue'],
  lines:['두부 친구지?','알바 중이라 답 늦어','고양이 깨우지 마','노크 고마워'],notes:[['두부','물 주고 감'],['서연','주말에 보자']]},
 {id:'hyunwoo',name:'현우',status:'헬스장',lit:false,night:false,lamp:false,water:0,items:['frame'],
  lines:['ㅇㅇ 왔냐','운동 중','화분 죽기 직전임 물 좀'],notes:[['두부','화분 좀 챙겨라']]},
 {id:'seoyeon',name:'서연',status:'자는 중',lit:false,night:true,lamp:false,water:5,items:['lights'],fish:['f_puff'],
  lines:['…누구세요','자는 중이었는데','내일 다시 와'],notes:[['민지','잘 자']]}
];
const SHOP=[{k:'cat',img:'i_cat',el:'#itCat',name:'낮잠 자는 고양이',desc:'러그 옆에서 잠',price:30},{k:'lights',img:'i_lights',el:'#itLights',name:'줄 조명',desc:'밤에 켜지면 예뻐',price:20},{k:'frame',img:'i_frame',el:'#itFrame',name:'문 그림 액자',desc:'벽 가운데',price:15}];
const FISH=[{k:'f_blue',name:'파랑이',coin:5,p:.6},{k:'f_gold',name:'금붕어',coin:12,p:.3},{k:'f_puff',name:'복어',coin:30,p:.1}];
const FOUND=['knock','talk','rub','spam','window','lamp','plant','music','mail','walk','fish','shop'];
const found=new Set(), S={};
let cur=FRIENDS[0], view='door', knocks=0, coins=12, bait=3, bubbleT, walkRAF, hintT;
const st=()=>S[cur.id]??={night:!!cur.night,lamp:!!cur.lamp,play:false,water:cur.water,x:50,y:80,items:new Set(cur.items),fish:[...(cur.fish||[])],notes:cur.notes.map(n=>[...n])};
const nm=()=>cur.name+'네';

function mark(k){ if(!found.has(k)){found.add(k);drawDots();} }
function drawDots(){ $('#dots').innerHTML=FOUND.map(k=>`<i class="${found.has(k)?'on':''}"></i>`).join(''); }
function hud(){ $('#coins').textContent=coins; $('#bait').textContent=bait; $('#castBtn').textContent=bait>0?`던지기 (미끼 ${bait})`:'미끼가 없어'; $('#castBtn').classList.toggle('off',bait<=0); }
function fx(t,x,y,parent){ const s=document.createElement('span'); s.className='fx'; s.textContent=t; s.style.left=x+'%'; s.style.top=y+'%'; (parent||stage).appendChild(s); setTimeout(()=>s.remove(),1100); }
function hint(h,keep){ const el=$('#hint'); el.innerHTML=h; el.style.opacity=1; clearTimeout(hintT); if(!keep) hintT=setTimeout(()=>el.style.opacity=0,6500); }
function charH(){ const s=st(); return 16.6*(.86+(s.y-67)/24*.24); }
function say(t,ms=1900){ const b=$('#bubble'), s=st(); b.textContent=t; b.style.left=s.x+'%'; b.style.top=(s.y-charH()-1.2)+'%'; b.classList.add('on'); clearTimeout(bubbleT); bubbleT=setTimeout(()=>b.classList.remove('on'),ms); }
function setPose(k){ const m=META['c_'+k]; $('#charImg').src=IMG['c_'+k]; $('#char').dataset.pose=k; $('#char').style.height=(charH()*m[1]/430)+'%'; }
function placeChar(){ const s=st(), c=$('#char'); c.style.left=s.x+'%'; c.style.top=s.y+'%'; c.style.zIndex=Math.round(s.y*10); c.style.height=(charH()*META['c_'+(c.dataset.pose||'stand')][1]/430)+'%'; }

function show(v){
  if(v==='shop'){ openShop(); return; }
  view=v; ['door','room','pond','alley'].forEach(n=>$('#'+n).classList.toggle('on',n===v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(v==='pond'&&b.dataset.v==='room')));
  $('#gb').classList.remove('on'); $('#shop').classList.remove('on'); $('#bubble').classList.remove('on');
  if(v==='door'){ knocks=0; $('#doorWrap').classList.remove('open','kn'); $('#plate').textContent=nm(); $('#tapTxt').textContent='여기를 톡톡'; $('#pulse').style.display=''; $('#where').textContent=nm()+' 문 앞'; hint('문을 <b>두 번</b> 두드려봐. 케이스 QR을 찍으면 이 화면이 먼저 떠.',true); }
  if(v==='room'){ applyRoom(); $('#where').textContent=nm()+' 방 · '+cur.status; hint(cur.me?'<b>캐릭터, 창문, 스탠드, 화분, 턴테이블, 우편함, 어항, 바닥</b> 다 눌러봐. 어항은 낚시터로 가.':`${cur.name}네 방이야. 화분에 물을 주면 내 화분도 같이 자라.`); setTimeout(()=>say(st().night&&!st().lamp?'zZ…':cur.lines[0]),450); }
  if(v==='pond'){ resetPond(); $('#where').textContent='낚시터'; hint('마당 연못이야. <b>던지기</b>를 누르고, 찌가 쑥 들어가며 <b>!</b>가 뜨는 순간 물을 톡 눌러.',true); hud(); }
  if(v==='alley'){ drawAlley(); $('#where').textContent='골목'; hint('문을 누르면 그 집으로 가. 친구 문을 두드리면 미끼가 1개 생겨.',true); }
}

function applyRoom(){
  const s=st(), r=$('#room');
  r.classList.toggle('night',s.night); r.classList.toggle('lampon',s.lamp);
  $('#bgNight').style.opacity=s.night&&!s.lamp?1:0; $('#bgLamp').style.opacity=s.night&&s.lamp?1:0;
  $('#dayglow').style.opacity=!s.night&&s.lamp?1:0; $('#dayglow2').style.opacity=!s.night&&s.lamp?1:0;
  SHOP.forEach(it=>$(it.el).style.display=s.items.has(it.k)?'':'none');
  const lv=s.water>=6?4:s.water>=4?3:s.water>=2?2:1, m=META['p'+lv]; $('#plantImg').src=IMG['p'+lv]; $('#plant').style.height=(15.2*m[1]/400)+'%'; $('#plant').dataset.lv=lv;
  $('#bowlFish').innerHTML=s.fish.slice(-3).map((k,i)=>`<div class="fish" style="left:${4+i*22}%;top:${[8,46,24][i]}%;animation-duration:${2.6+i*.9}s;animation-delay:${-i*.8}s"><img src="${IMG[k]}"></div>`).join('');
  const sleep=s.night&&!s.lamp; setPose(sleep?'sleep':'stand'); $('#charIn').className=sleep?'':(s.play?'groove':'breath'); placeChar();
}

/* 문 */
on($('#doorTap'),()=>{
  if(knocks>=2) return; knocks++; buzz(30); fx('똑',38+Math.random()*24,44+Math.random()*10);
  const d=$('#doorWrap'); d.classList.remove('kn'); void d.offsetWidth; d.classList.add('kn');
  $('#tapTxt').textContent=knocks<2?'한 번 더':'';
  if(knocks>=2){ mark('knock'); $('#pulse').style.display='none'; if(!cur.me){ bait++; hud(); setTimeout(()=>fx('미끼 +1',50,30),300); }
    setTimeout(()=>{ d.classList.remove('kn'); d.classList.add('open'); $('#veil').classList.add('on'); },280);
    setTimeout(()=>{ show('room'); $('#veil').classList.remove('on'); },1000); }
});

/* 방 */
let taps=[], rub=0, down=false, last=null;
on($('#char'),e=>{
  e.stopPropagation(); down=true; rub=0; last=pct(e); const s=st(), b=$('#charIn'), now=Date.now();
  if(s.night&&!s.lamp){ s.lamp=true; applyRoom(); say('…누구세요'); mark('talk'); return; }
  taps=taps.filter(t=>now-t<1700); taps.push(now);
  if(taps.length>=5){ taps=[]; setPose('dizzy'); b.className=''; say('그만 눌러 ;;',1700); buzz([20,40,20]); mark('spam'); setTimeout(()=>{ if(view==='room'){ setPose('stand'); b.className=st().play?'groove':'breath'; } },1700); }
  else{ setPose('jump'); b.className=''; void b.offsetWidth; b.className='hop'; say(cur.lines[Math.floor(Math.random()*cur.lines.length)]); mark('talk'); setTimeout(()=>{ if($('#char').dataset.pose==='jump'){ setPose('stand'); b.className=st().play?'groove':'breath'; } },460); }
});
stage.addEventListener('pointermove',e=>{ if(!down||view!=='room')return; const p=pct(e); rub+=Math.hypot(p.x-last.x,p.y-last.y); last=p; if(rub>22){ rub=0; const s=st(); fx('♥',s.x+(Math.random()*10-5),s.y-charH()); say('헤헤'); mark('rub'); } });
addEventListener('pointerup',()=>down=false);
on($('#hWin'),e=>{ e.stopPropagation(); const s=st(); s.night=!s.night; applyRoom(); say(s.night?(s.lamp?'밤이네':'zZ…'):'아 눈부셔'); mark('window'); });
on($('#hLamp'),e=>{ e.stopPropagation(); const s=st(); s.lamp=!s.lamp; applyRoom(); if(s.night)say(s.lamp?'불 켜줘서 고마워':'zZ…'); else fx(s.lamp?'딸깍':'탁',88,36); mark('lamp'); });
on($('#hDeck'),e=>{ e.stopPropagation(); const s=st(); s.play=!s.play; applyRoom(); if(s.play){ fx('♪',64,31); setTimeout(()=>fx('♫',70,33),260); setTimeout(()=>fx('♪',61,30),620); if(!(s.night&&!s.lamp))say('요즘 듣는 노래'); } mark('music'); });
on($('#hMail'),e=>{ e.stopPropagation(); openGb(); mark('mail'); });
on($('#hBowl'),e=>{ e.stopPropagation(); if(!cur.me){ say('낚시는 내 방에서만'); return; } show('pond'); mark('fish'); });
on($('#plant'),e=>{
  e.stopPropagation(); const s=st(), lv=+$('#plant').dataset.lv;
  if(lv===4&&cur.me){ s.water=0; coins+=10; hud(); applyRoom(); fx('수확 +10',14.5,78); say('꽃 팔았다'); const p=$('#plant'); p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop'); }
  else{ s.water++; applyRoom(); fx('물 +1',14.5,96.6-15.2*META['p'+$('#plant').dataset.lv][1]/400-2); const nl=+$('#plant').dataset.lv;
    if(!cur.me){ const me=S.dubu||(S.dubu={night:false,lamp:false,play:false,water:3,x:50,y:80,items:new Set(),fish:[],notes:FRIENDS[0].notes.map(n=>[...n])}); me.water++; say('물 고마워'); setTimeout(()=>fx('내 화분도 +1',50,60),350); }
    else say(nl>lv?(nl===4?'꽃 폈다! 누르면 수확':'오 자랐다'):'물 고마워'); }
  mark('plant');
});
on($('#room'),e=>{
  const p=pct(e); if(p.y<61||view!=='room')return; const s=st(); if(s.night&&!s.lamp)return;
  let tx=Math.max(20,Math.min(74,p.x)), ty=Math.max(67,Math.min(91,p.y)); if(ty>80&&tx>68)tx=68; if(ty>86&&tx<27)tx=27;
  const fx0=s.x, fy0=s.y, t0=performance.now(), dur=Math.max(260,Math.hypot(tx-fx0,(ty-fy0)*1.6)*26), b=$('#charIn');
  cancelAnimationFrame(walkRAF); setPose('stand'); b.className='walk'; $('#charImg').style.transform=tx<fx0?'scaleX(-1)':''; $('#bubble').classList.remove('on');
  (function step(t){ const k=Math.min(1,(t-t0)/dur); s.x=fx0+(tx-fx0)*k; s.y=fy0+(ty-fy0)*k; placeChar(); if(k<1)walkRAF=requestAnimationFrame(step); else b.className=s.play?'groove':'breath'; })(t0);
  mark('walk');
});

/* 방명록 */
function openGb(){ const s=st(); $('#gbT').textContent=nm()+' 방명록'; $('#notes').innerHTML=s.notes.map(([n,t])=>`<li><b>${n}</b>${t}</li>`).join(''); $('#gb').classList.add('on'); }
$('#gbX').onclick=()=>$('#gb').classList.remove('on');
$('#noteF').onsubmit=e=>{ e.preventDefault(); const v=$('#noteI').value.trim(); if(!v)return; const d=document.createElement('div'); d.textContent=v; st().notes.unshift(['나',d.innerHTML]); $('#noteI').value=''; $('#noteI').blur(); openGb(); setTimeout(()=>{ $('#gb').classList.remove('on'); say('잘 읽을게'); },600); };

/* 상점 */
function openShop(){
  if(view!=='room'||!cur.me){ cur=FRIENDS[0]; show('room'); }
  const s=st(); $('#shopList').innerHTML=SHOP.map((it,i)=>{ const own=s.items.has(it.k)||it.bought; return `<div class="shopRow"><div class="th"><img src="${IMG[it.img]}"></div><div><b>${it.name}</b><small>${it.desc}</small></div><button class="pill btn ${it.bought?'own':(coins<it.price?'off':'')}" data-i="${i}">${it.bought?(s.items.has(it.k)?'넣어두기':'꺼내기'):`<img src="${IMG.coin}">${it.price}`}</button></div>`; }).join('');
  $('#shop').classList.add('on'); mark('shop');
}
$('#shopX').onclick=()=>$('#shop').classList.remove('on');
$('#shopList').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; const it=SHOP[+b.dataset.i], s=st();
  if(it.bought){ s.items.has(it.k)?s.items.delete(it.k):s.items.add(it.k); }
  else if(coins>=it.price){ coins-=it.price; it.bought=true; s.items.add(it.k); hud(); $('#shop').classList.remove('on'); applyRoom(); const el=$(it.el); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); setTimeout(()=>say('오 좋은데'),300); return; }
  else{ b.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:220}); hint('코인이 모자라. <b>어항</b>을 눌러 낚시하거나 화분 꽃을 수확해.'); return; }
  applyRoom(); openShop(); });

/* 낚시 */
let pondState='idle', biteT, missT;
function resetPond(){ pondState='idle'; clearTimeout(biteT); clearTimeout(missT); $('#bobber').className=''; $('#ring1').classList.remove('go'); $('#ring2').classList.remove('go'); $('#bang').classList.remove('on'); $('#catch').classList.remove('on'); $('#castBtn').style.display=''; $('#baitMore').style.display=''; }
on($('#castBtn'),e=>{ e.stopPropagation(); if(pondState!=='idle')return; if(bait<=0){ hint('미끼가 없어. 미끼는 <b>노크를 받아야</b> 생겨. 지금은 위 점선 버튼으로 받아봐.',true); return; }
  bait--; hud(); pondState='wait'; $('#catch').classList.remove('on'); $('#castBtn').style.display='none'; $('#baitMore').style.display='none'; $('#bobber').className='in'; $('#ring1').classList.add('go'); fx('퐁',50,42); hint('기다려… <b>!</b>가 뜨면 바로 눌러.',true);
  biteT=setTimeout(()=>{ pondState='bite'; $('#bobber').className='in bite'; $('#ring2').classList.add('go'); $('#bang').classList.add('on'); buzz([40,30,40]);
    missT=setTimeout(()=>{ if(pondState==='bite') endCast(null,'놓쳤다…'); },950); },1300+Math.random()*2200);
});
on($('#pondTap'),()=>{ if(pondState==='wait'){ clearTimeout(biteT); endCast(null,'너무 빨랐어'); } else if(pondState==='bite'){ clearTimeout(missT); let r=Math.random(), f=FISH[0]; for(const x of FISH){ if(r<x.p){f=x;break;} r-=x.p; } endCast(f); } });
function endCast(f,msg){ pondState='idle'; $('#bobber').className=''; $('#ring1').classList.remove('go'); $('#ring2').classList.remove('go'); $('#bang').classList.remove('on'); $('#castBtn').style.display=''; $('#baitMore').style.display='';
  if(f){ coins+=f.coin; (S.dubu||st()).fish.push(f.k); hud(); $('#catchImg').src=IMG[f.k]; $('#catchTxt').textContent=`${f.name} +${f.coin}`; $('#catch').classList.add('on'); buzz(60); hint(`<b>${f.name}</b>를 잡았어. 어항에 넣어뒀어. 코인으로 <b>상점</b>에서 방을 꾸며봐.`,true); setTimeout(()=>$('#catch').classList.remove('on'),2200); }
  else{ fx(msg,50,40); hint(msg+' 미끼만 날렸네. 다시 던져봐.',true); } }
on($('#baitMore'),e=>{ e.stopPropagation(); bait++; hud(); fx('민지가 노크함 · 미끼 +1',50,60); });

/* 골목 */
function drawAlley(){ $('#houses').innerHTML=FRIENDS.map((n,i)=>`<button class="house ${(S[n.id]?S[n.id].night&&!S[n.id].lamp:n.night&&!n.lamp)?'dark':''}" data-i="${i}"><img src="${IMG.door}">${n.lit?'<i class="lit"></i>':''}<div class="nm"><b>${n.name}${n.me?' (내 방)':''}</b><span>${n.status} · ${n.lit?'오늘 방이 바뀜':'변화 없음'}</span></div></button>`).join(''); }
$('#houses').addEventListener('click',e=>{ const h=e.target.closest('.house'); if(!h)return; cur=FRIENDS[+h.dataset.i]; show('door'); });
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));

/* walking with frames + obstacles */
let frameT=null;
function startFrames(){ const L=lookSet(); clearInterval(frameT); if(!L.walk)return; let i=0; frameT=setInterval(()=>{ i^=1; const key=L.walk[i]; $('#charImg').src=IMG[key]; $('#char').dataset.key=key; placeChar(); },170); const k0=L.walk[0]; $('#charImg').src=IMG[k0]; $('#char').dataset.key=k0; }
function stopFrames(){ clearInterval(frameT); frameT=null; }
function clampTarget(tx,ty){
  tx=Math.max(8,Math.min(92,tx)); ty=Math.max(63,Math.min(93,ty));
  if(hasF('bed')){ const b=fbox('bed'); if(tx>b.left-3&&tx<b.right+3&&ty<b.bottom+2) ty=b.bottom+2.5; }
  if(hasF('sofa')){ const s=fbox('sofa'); if(tx>s.left&&tx<s.right&&ty>s.top+3) ty=s.top+3; }
  if(hasF('lamp')){ const l=fbox('lamp'); if(Math.abs(tx-l.x)<5&&Math.abs(ty-l.bottom)<3) tx=l.x+(tx<l.x?-6:6); }
  return [Math.max(8,Math.min(92,tx)),ty];
}
function walkTo(tx,ty,done){
  const s=st(); [tx,ty]=clampTarget(tx,ty);
  const fx0=s.x, fy0=s.y, t0=performance.now(), dur=Math.max(260,Math.hypot(tx-fx0,(ty-fy0)*1.6)*26), b=$('#charIn');
  cancelAnimationFrame(walkRAF); wake(true); setPose('stand'); b.className='walk'; startFrames();
  $('#charImg').style.transform=tx<fx0?'scaleX(-1)':''; $('#bubble').classList.remove('on');
  (function step(t){ const k=Math.min(1,(t-t0)/dur); s.x=fx0+(tx-fx0)*k; s.y=fy0+(ty-fy0)*k; placeChar(); if(k<1)walkRAF=requestAnimationFrame(step); else { stopFrames(); setPose('stand'); b.className=s.play?'groove':'breath'; $('#charImg').style.transform=''; done&&done(); } })(t0);
  mark('walk');
}

function sleepInBed(){ const s=st(), bed=$('#f_bed'); if(!bed)return; s.inBed=true; const L=lookSet(); const sl=bed.querySelector('.sleeper'); sl.src=IMG[L.lie]; bed.classList.add('sleeping'); $('#char').style.visibility='hidden'; $('#bubble').classList.remove('on');

function makePet(el,bounds,charPos){
  const P={el,x:bounds.x0+10,y:bounds.y1-6,raf:0,t:0,
    place(){ const h=bounds.h(P.y); el.style.left=P.x+'%'; el.style.top=P.y+'%'; el.style.height=h+'%'; el.style.zIndex=Math.round(P.y*10)+1; },
    go(tx,ty){ const d=PETS[SAVE.pet]; if(!d)return; const x0=P.x,y0=P.y,t0=performance.now(),dur=Math.max(400,Math.hypot(tx-x0,(ty-y0)*1.6)*40); const img=el.querySelector('img'); img.src=IMG[d.w];
      const left=tx<x0; img.style.transform=(left?(d.wf==='L'?'':'scaleX(-1)'):(d.wf==='L'?'scaleX(-1)':'')); el.classList.add('pwalk');
      cancelAnimationFrame(P.raf); (function step(t){ const k=Math.min(1,(t-t0)/dur); P.x=x0+(tx-x0)*k; P.y=y0+(ty-y0)*k; P.place(); if(k<1)P.raf=requestAnimationFrame(step); else { el.classList.remove('pwalk'); img.src=IMG[d.s]; img.style.transform=left?(d.sf==='L'?'':'scaleX(-1)'):(d.sf==='L'?'scaleX(-1)':''); } })(t0); },
    tick(){ if(!PETS[SAVE.pet]||!el.offsetParent)return; const c=charPos(); let tx,ty; if(c&&Math.random()<.4){ tx=c.x+(Math.random()<.5?-9:9); ty=c.y+2; } else { tx=bounds.x0+Math.random()*(bounds.x1-bounds.x0); ty=bounds.y0+Math.random()*(bounds.y1-bounds.y0); } [tx,ty]=bounds.fix(Math.max(bounds.x0,Math.min(bounds.x1,tx)),Math.max(bounds.y0,Math.min(bounds.y1,ty))); P.go(tx,ty); },
    show(){ const d=PETS[SAVE.pet]; el.style.display=d&&(cur.me||el.id==='petY')?'':'none'; if(d){ el.querySelector('img').src=IMG[d.s]; P.place(); } }
  };
  on(el,e=>{ e.stopPropagation(); if(!PETS[SAVE.pet])return; SAVE.happy=Math.min(100,SAVE.happy+6); persist(); petHud(); fx('♥',P.x,P.y-bounds.h(P.y)-1); buzz(20); const i=el.querySelector('img'); i.animate([{transform:i.style.transform+' translateY(0)'},{transform:i.style.transform+' translateY(-12%)'},{transform:i.style.transform+' translateY(0)'}],{duration:350}); });
  setInterval(()=>P.tick(),4200+Math.random()*2500);
  return P;
}

  trayDraw(); });

/* ---- fishing line + rod ---- */
const NS='http://www.w3.org/2000/svg', P=$('#pond');
P.querySelector('#bobber').insertAdjacentHTML('beforebegin','<svg id="fline" viewBox="0 0 828 1484" preserveAspectRatio="none"><path id="flp" fill="none" stroke="#fffdf6" stroke-width="5" stroke-linecap="round" opacity=".95"/><path id="flp2" fill="none" stroke="#4a3528" stroke-width="2.2" stroke-linecap="round"/></svg>');
P.querySelector('#bang').insertAdjacentHTML('beforebegin','<svg id="frod" viewBox="0 0 828 1484" preserveAspectRatio="none"><path id="rodO" fill="none" stroke="#4a3528" stroke-width="20" stroke-linecap="round"/><path id="rodW" fill="none" stroke="#b9875a" stroke-width="11" stroke-linecap="round"/><path id="rodG" fill="none" stroke="#6b4a33" stroke-width="13" stroke-linecap="round"/><circle id="rodR" r="24" fill="#e9dcc3" stroke="#4a3528" stroke-width="6"/><circle id="rodR2" r="7" fill="#4a3528"/><circle id="rodT" r="6" fill="#e86a5a" stroke="#4a3528" stroke-width="3"/></svg>');
const BASE=[778,1500], TIP0=[548,884];
let fs={prev:'idle',castT:0,reelT:0,reelFrom:null}, flRAF=0;
function bobPt(){ const sr=stage.getBoundingClientRect(), im=$('#bobber img'), r=im.getBoundingClientRect(); if(!r.width) return null; const k=828/sr.width; return [(r.left+r.width/2-sr.left)*k,(r.top-sr.top)*k+4]; }
function frame(){ flRAF=requestAnimationFrame(frame); if(view!=='pond') return;
  const t=performance.now(), ps=pondState;
  if(ps==='wait'&&fs.prev==='idle') fs.castT=t;
  if(fs.prev==='bite'&&ps==='idle'&&$('#catch').classList.contains('on')){ fs.reelT=t; fs.reelFrom=fs.last; }
  fs.prev=ps;
  const bite=ps==='bite', reel=t-fs.reelT<520;
  const tip=bite?[TIP0[0]-14+Math.sin(t/45)*6,TIP0[1]+34]:reel?[TIP0[0]-8,TIP0[1]+22]:TIP0;
  /* rod: curve from base to tip, bends more on a bite */
  const bend=bite?70:reel?50:22, mx=(BASE[0]+tip[0])/2, my=(BASE[1]+tip[1])/2, dx=tip[0]-BASE[0], dy=tip[1]-BASE[1], L=Math.hypot(dx,dy), nx=-dy/L, ny=dx/L;
  const rod=`M${BASE[0]} ${BASE[1]} Q${mx+nx*bend} ${my+ny*bend} ${tip[0]} ${tip[1]}`;
  $('#rodO').setAttribute('d',rod); $('#rodW').setAttribute('d',rod);
  const gx=BASE[0]+dx*.16, gy=BASE[1]+dy*.16; $('#rodG').setAttribute('d',`M${BASE[0]} ${BASE[1]} L${gx} ${gy}`);
  $('#rodR').setAttribute('cx',BASE[0]+dx*.2-22); $('#rodR').setAttribute('cy',BASE[1]+dy*.2+4); $('#rodR2').setAttribute('cx',BASE[0]+dx*.2-22); $('#rodR2').setAttribute('cy',BASE[1]+dy*.2+4);
  $('#rodT').setAttribute('cx',tip[0]); $('#rodT').setAttribute('cy',tip[1]);
  /* line */
  let end, sag;
  if(ps==='wait'||ps==='bite'){ const b=bobPt()||[414,620]; const ct=Math.min(1,(t-fs.castT)/380); end=[tip[0]+(b[0]-tip[0])*ct,tip[1]+(b[1]-tip[1])*ct]; sag=bite?0:(ct<1?20:Math.hypot(b[0]-tip[0],b[1]-tip[1])*.16); }
  else if(reel&&fs.reelFrom){ const k=Math.min(1,(t-fs.reelT)/520); end=[fs.reelFrom[0]+(tip[0]-fs.reelFrom[0])*k,fs.reelFrom[1]+(tip[1]+120-fs.reelFrom[1])*k]; sag=0; }
  else { end=[tip[0]+Math.sin(t/700)*6,tip[1]+120]; sag=6; }
  fs.last=end;
  const cx=(tip[0]+end[0])/2+(ps==='wait'?-sag*.35:0), cy=(tip[1]+end[1])/2+sag;
  const d=`M${tip[0]} ${tip[1]} Q${cx} ${cy} ${end[0]} ${end[1]}`; $('#flp').setAttribute('d',d); $('#flp2').setAttribute('d',d);
  $('#fline').dataset.state=reel?'reel':ps==='wait'?'slack':ps==='bite'?'taut':'idle';
}
frame();
